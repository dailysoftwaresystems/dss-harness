name: Test

# The build and test matrix, which pipeline-pr.yml runs on every pull request and every
# push to main. What a release promotes passed it there: merging waits for the required
# check that rolls it up, and neither Deploy nor the package pipeline runs a suite; see
# "The required check" in docs/releasing.md.
#
# Linux, Windows and macOS, each on x86_64 and on arm64, always. Behaving identically
# everywhere is this tool's central claim, so a change that passes on one runner and fails
# on another is a real defect, not a CI quirk. Every leg runs on a native runner rather
# than under emulation: .NET is not supported under QEMU, so an emulated leg could fail,
# or pass, for reasons that have nothing to do with the code.
#
# The suite is split into shards where one runner would take too long over it: a shard is a
# set of whole test classes. The deal job deals every runner's shards once for the run,
# before any shard starts, each class to the shard lightest so far by the seconds it took
# when that runner last ran it, and every shard runs the classes it was dealt; a class dealt
# to none, or to two, of a runner's shards fails the run. The times job, once the shards have
# run, keeps what each class took for the next run's deal.
#
# Every action is pinned to a full commit SHA; see docs/releasing.md.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deal:
    # The run's one deal: every runner's shards, from one file of times a runner, before any shard
    # starts. A shard that dealt itself would read whichever times another shard of the same run
    # had just saved, and two shards of one runner could each be dealt a class, or neither. "Re-run failed jobs" runs a failed shard on the classes it failed on: a job
    # that succeeded is not run again, and its outputs and artifacts stand for every attempt after.
    name: deal
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      matrix: ${{ steps.deal.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Build
        # The suite is built here only to be listed: the deal runs none of it.
        run: dotnet build DssHarness.slnx --configuration Release

      - name: Restore test times
        # What each test class took when each runner last ran it, a file a runner, as the times job of
        # the run that saved them last kept them. None the first time, and the deal then weighs a class
        # by the tests it holds.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-times
          key: test-class-times-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: test-class-times-

      - name: Deal
        # The classes are dealt out heaviest first, each to the shard lightest so far, so a runner's
        # shards together run every class once. A class weighs the seconds its tests took when that
        # runner last ran them: how many tests a class holds says nothing of how long they run - a
        # class of rebases or of flows runs a minute a test where another runs a millisecond, and dealt
        # by counts the heavy ones met in one shard, which ran past the step's limit while another of
        # the same runner ended in twenty minutes. A class the runner never timed weighs its tests and
        # one more for itself, at the seconds a test of the classes it timed took on average; where it
        # timed none, counts alone. The suite's two listings - its classes, and its tests by name - name
        # the same classes, or a class would go undealt; and each runner's shards hold every class once,
        # each shard one at least, or the deal fails rather than leave a class to run twice or never.
        id: deal
        shell: bash
        env:
          # Shards per runner, from how long one run of the whole suite takes there: Linux holds
          # it in one shard; Windows x86_64 in two; Windows arm64 in three, since that runner's
          # speed wanders threefold between runs; macOS arm64 in three, and macOS x86_64, by far
          # the slowest, in eight. GitHub runs only so many macOS jobs at once and queues the
          # rest, so a macOS shard added shortens each shard more than it does the leg.
          #
          # A class is atomic to a shard. One class whose every test runs for minutes on the slow
          # runners, as the implementation flow's do, still weighs what many of the suite's other
          # classes do together, and no shard can be lighter than it; so the flow's tests are held
          # in batteries, each a class of its own (ImplementationFlowTests+Planning and its
          # siblings), which the deal spreads; when one grows until its shard nears the Test
          # step's limit, the answer is more shards here, or that battery split again - never a
          # longer limit.
          RUNNERS: |
            ubuntu-latest 1           # Linux x86_64
            ubuntu-24.04-arm 1        # Linux arm64
            windows-latest 2          # Windows x86_64
            windows-11-vs2026-arm 3   # Windows arm64
            macos-26-intel 8          # macOS x86_64
            macos-latest 3            # macOS arm64
        run: |
          set -eo pipefail
          suite=./build/bin/dss-harness-test/release/dss-harness-test
          deal="$RUNNER_TEMP/test-deal"
          mkdir -p "$deal/times" "$deal/shards"

          # The classes, and how many tests each holds: a test's name is its class's, a dot, its
          # method's, and a theory's arguments in brackets. Listing runs no test, which the suite's
          # runner reports as exit 8.
          "$suite" --xunit-list classes --ignore-exit-code 8 | tr -d '\r' \
            | grep -E '^[A-Za-z_][A-Za-z0-9_.+`]*$' | LC_ALL=C sort > "$deal/classes.txt"

          "$suite" --list-tests --ignore-exit-code 8 | tr -d '\r' \
            | awk '/^  [A-Za-z_]/ && !/^  duration:/ {
                name = substr($0, 3); at = index(name, "(")
                if (at) name = substr(name, 1, at - 1)
                sub(/\.[^.]*$/, "", name); held[name]++
              }
              END { for (name in held) print held[name], name }' > "$deal/tests.txt"

          if ! cut -d ' ' -f 2 "$deal/tests.txt" | LC_ALL=C sort | cmp -s - "$deal/classes.txt"; then
            echo "::error::The suite's classes and the classes its tests name differ, so the deal would leave a class out: $(cut -d ' ' -f 2 "$deal/tests.txt" | LC_ALL=C sort | LC_ALL=C comm -3 - "$deal/classes.txt" | tr -d '\t' | tr '\n' ' ')"
            exit 1
          fi

          matrix=
          while read -r os shards _; do
            [ -n "$os" ] || continue

            case "$shards" in
              '' | 0* | *[!0-9]*) echo "::error::Runner $os is given '$shards' shards; a runner takes one or more."; exit 1 ;;
            esac

            # The times the runner's classes took, as the times job last kept them; none for a runner
            # never timed. Every file reaches awk as an operand, which it opens as named and fails on
            # where it cannot, and every number through its environment: never through -v, which reads
            # the escapes in a value.
            if [ -f "$RUNNER_TEMP/test-times/$os.txt" ]; then
              cp "$RUNNER_TEMP/test-times/$os.txt" "$deal/times/$os.txt"
            else
              : > "$deal/times/$os.txt"
            fi

            mkdir -p "$deal/shards/$os"

            awk '
              FILENAME == ARGV[1] { held[$2] = $1; next }
              FILENAME == ARGV[2] { took[$2] = $1; next }
              { classes[++n] = $0 }
              END {
                for (i = 1; i <= n; i++) if (classes[i] in took) { seconds += took[classes[i]]; counted += held[classes[i]] + 1 }
                rate = seconds > 0 ? seconds / counted : 1
                for (i = 1; i <= n; i++) {
                  class = classes[i]
                  printf "%.3f %s\n", (class in took ? took[class] : (held[class] + 1) * rate), class
                }
              }' "$deal/tests.txt" "$deal/times/$os.txt" "$deal/classes.txt" \
              | LC_ALL=C sort -k1,1nr -k2,2 \
              | SHARDS="$shards" DEALT="$deal/shards/$os" awk '
                  BEGIN { n = ENVIRON["SHARDS"] + 0 }
                  {
                    least = 1
                    for (s = 2; s <= n; s++) if (load[s] < load[least]) least = s
                    load[least] += $1
                    print $2 > (ENVIRON["DEALT"] "/" least ".txt")
                  }'

            for shard in $(seq "$shards"); do
              if [ ! -s "$deal/shards/$os/$shard.txt" ]; then
                echo "::error::Shard $shard of $shards of $os holds no test class: the suite lists $(wc -l < "$deal/classes.txt" | tr -d ' ')."
                exit 1
              fi

              matrix="$matrix${matrix:+,}{\"os\":\"$os\",\"shard\":$shard,\"shards\":$shards}"
            done

            if ! cat "$deal/shards/$os"/*.txt | LC_ALL=C sort | cmp -s - "$deal/classes.txt"; then
              echo "::error::The shards of $os do not hold every test class once."
              exit 1
            fi

            echo "$os: $(for shard in $(seq "$shards"); do wc -l < "$deal/shards/$os/$shard.txt" | tr -d ' '; done | paste -sd ' ' -) of $(wc -l < "$deal/classes.txt" | tr -d ' ') test classes."
          done <<< "$RUNNERS"

          echo "matrix={\"include\":[$matrix]}" >> "$GITHUB_OUTPUT"

      - name: Hand on the deal
        # Overwrite, so "Re-run all jobs" replaces the deal an earlier attempt of this run uploaded.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-deal
          path: ${{ runner.temp }}/test-deal
          if-no-files-found: error
          overwrite: true

  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: deal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      # Every platform's result is wanted. Cancelling the others on the first failure
      # hides whether a break is platform specific, which is exactly the question this
      # matrix exists to answer.
      fail-fast: false
      #
      # Every runner's every shard, as the deal job dealt them (its Deal step's RUNNERS).
      matrix: ${{ fromJSON(needs.deal.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so no credential is left in the working copy for the
          # code under test to find.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DssHarness.slnx

      - name: Build
        # Warnings are errors and NuGet auditing is on, so a newly disclosed advisory
        # against a pinned dependency fails here rather than shipping.
        run: dotnet build DssHarness.slnx --configuration Release --no-restore

      - name: Build tools
        # The end-to-end tests build a real CMake project with ninja and the runner's own C and C++ compilers - on
        # Windows with MinGW's and with Visual Studio's - and here a runner lacking one fails them (see the variable
        # the Test step sets) rather than skipping them green. Every image carries cmake and its compilers; ninja is
        # installed where an image carries none, as the arm64 Linux image's own list of what it holds says it does not.
        shell: bash
        run: |
          command -v ninja >/dev/null && exit 0

          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install --yes ninja-build ;;
            macOS) brew install ninja ;;
            Windows) choco install ninja --yes --no-progress ;;
          esac

      - name: Isolation
        # The tests of an agent's isolation run the system's bubblewrap for real, and here a runner lacking it fails them
        # (see the variable the Test step sets) rather than skipping them green. No Linux image carries it, and where
        # Ubuntu restricts unprivileged user namespaces the AppArmor profile for it is loaded - the remedy the tool names:
        # in place where the apparmor package ships it there (Ubuntu 25.04 and later), copied first from the
        # apparmor-profiles package's extra profiles where it does not (Ubuntu 24.04).
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            profile=/etc/apparmor.d/bwrap-userns-restrict

            if [ ! -f "$profile" ]; then
              sudo apt-get install --yes apparmor-profiles
              sudo cp /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/
            fi

            sudo apparmor_parser -r "$profile"
          fi

      - name: The deal
        # The run's deal, which every shard of it runs by: an earlier attempt's, where this one runs a
        # failed shard again. Kept outside the checkout, which some tests read.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-deal
          path: ${{ runner.temp }}/test-deal

      - name: Test
        # The suite's own executable, which exits non-zero when any test fails: never through
        # dotnet, which the suite then finds running it and starts its children with by path.
        # Run directly, it says what dotnet test keeps to itself: each test still running after
        # two minutes, named again every two minutes it runs on, and the slowest tests once the
        # run ends. And it is stopped short of the job's own limit: a job that limit ended kept
        # no log, so nothing said which test had hung. The limit is not how a hang is found -
        # the two-minute notice names it - and it sits well above the slowest shard, whose own
        # time wanders: the Intel macOS runner's time over one suite has varied by half again
        # between runs with no test hung and its slowest test under two minutes. Its time grows
        # with the suite and wanders with the runner; more shards, not a longer limit, are the
        # answer when a shard nears it.
        #
        # A shard runs the whole test classes the deal job dealt it, and no other.
        timeout-minutes: 75
        shell: bash
        env:
          # A runner is meant to hold cmake, ninja and a compiler: a test that really builds fails here where one is
          # lacking, and is skipped only on a developer's machine that has none.
          DSSHARNESS_TESTS_REQUIRE_BUILD_TOOLS: "1"
          RUNS_ON: ${{ matrix.os }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          # No -u: bash 3.2, macOS's own, reads an empty "$@" as unset.
          set -eo pipefail
          suite=./build/bin/dss-harness-test/release/dss-harness-test${{ runner.os == 'Windows' && '.exe' || '' }}
          deal="$RUNNER_TEMP/test-deal"

          set --
          while IFS= read -r class; do
            set -- "$@" "$class"
          done < "$deal/shards/$RUNS_ON/$SHARD.txt"

          echo "Shard $SHARD of $SHARDS: $# of $(wc -l < "$deal/classes.txt" | tr -d ' ') test classes."
          # Bounded by the suite itself short of the step's limit, a shard past its time ends aborted with what it ran
          # reported - its slowest tests among it - and the times job times its classes from that report.
          "$suite" --xunit-diagnostics on --long-running 120 --show-slowest-tests 20 --timeout 70m \
            --report-xunit-junit --report-xunit-junit-filename "$RUNS_ON-$SHARD.xml" --results-directory "$RUNNER_TEMP/test-report" \
            --filter-class "$@"

      - name: Hand on the report
        # What each class of this shard took, for the times job, named by its runner and shard. A shard
        # that wrote no report hands on none. Overwrite, so a shard run again replaces the report its
        # earlier attempt handed on.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-report/${{ matrix.os }}-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          overwrite: true

  times:
    # What each class took, kept for the next run's deal once the shards have run, failed or not: one
    # file a runner, written over the times this run was dealt by - each class a shard of this run
    # timed as its report says, the rest as the deal read them - and saved as one entry, which the
    # next run's deal restores whole. A class the suite's own bound cut short weighs as though the
    # tests it never ran took what its others did; a shard that handed on no report leaves its classes
    # the times they had. A file that is there and cannot be read fails the job.
    name: test times
    needs: [deal, test]
    if: always() && needs.deal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: The deal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-deal
          path: ${{ runner.temp }}/test-deal

      - name: The shards' reports
        # Each shard's latest attempt's, all in one directory.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-report-*
          path: ${{ runner.temp }}/test-report
          merge-multiple: true

      - name: Keep test times
        shell: bash
        run: |
          set -eo pipefail
          deal="$RUNNER_TEMP/test-deal"
          mkdir -p "$RUNNER_TEMP/test-times"

          for dealt in "$deal/shards"/*/; do
            os=$(basename "$dealt")

            # Each report is one line of XML: each test case's class and seconds, summed by class. The files reach
            # awk as operands, as the deal's do, and the reports last, on its input.
            for shard in "$dealt"*.txt; do
              report="$RUNNER_TEMP/test-report/$os-$(basename "$shard" .txt).xml"
              [ ! -f "$report" ] || tr '<' '\n' < "$report"
            done | awk '
              FILENAME == ARGV[1] { listed[$0] = 1; next }
              FILENAME == ARGV[2] { held[$2] = $1; next }
              FILENAME == ARGV[3] { took[$2] = $1; next }
              /^testcase / {
                if (!match($0, / time="[^"]*"/)) next
                seconds = substr($0, RSTART + 7, RLENGTH - 8)
                if (!match($0, / classname="[^"]*"/)) next
                class = substr($0, RSTART + 12, RLENGTH - 13)
                fresh[class] += seconds
                ran[class]++
              }
              END {
                for (class in fresh) took[class] = held[class] > ran[class] ? fresh[class] * held[class] / ran[class] : fresh[class]
                for (class in took) if (class in listed) printf "%.3f %s\n", took[class], class
              }' "$deal/classes.txt" "$deal/tests.txt" "$deal/times/$os.txt" - | LC_ALL=C sort -k2,2 > "$RUNNER_TEMP/test-times/$os.txt"

            echo "$os: $(wc -l < "$RUNNER_TEMP/test-times/$os.txt" | tr -d ' ') of $(wc -l < "$deal/classes.txt" | tr -d ' ') test classes timed."
          done

      - name: Save test times
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-times
          key: test-class-times-${{ github.run_id }}-${{ github.run_attempt }}
