name: Test

# The build and test matrix, which pipeline-pr.yml runs on every pull request and every
# push to main. What a release promotes passed it there: merging waits for the required
# check that rolls it up, and neither Deploy nor the package pipeline runs a suite; see
# "The required check" in docs/releasing.md.
#
# Linux, Windows and macOS, each on x86_64 and on arm64, always. Behaving identically
# everywhere is this tool's central claim, so a change that passes on one runner and fails
# on another is a real defect, not a CI quirk. Every leg runs on a native runner rather
# than under emulation: .NET is not supported under QEMU, so an emulated leg could fail,
# or pass, for reasons that have nothing to do with the code.
#
# The suite is split into shards where one runner would take too long over it: a shard is a
# set of whole test classes, dealt out heaviest first to the shard holding fewest tests so far
# (see the Test step), so a runner's shards together run every test once.
#
# Every action is pinned to a full commit SHA; see docs/releasing.md.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      # Every platform's result is wanted. Cancelling the others on the first failure
      # hides whether a break is platform specific, which is exactly the question this
      # matrix exists to answer.
      fail-fast: false
      #
      # Shards per runner, from how long one run of the whole suite takes there: Linux holds
      # it in one shard; Windows x86_64 in two; Windows arm64 in three, since that runner's
      # speed wanders threefold between runs; macOS arm64 in three, and macOS x86_64, by far
      # the slowest, in eight. GitHub runs only so many macOS jobs at once and queues the
      # rest, so a macOS shard added shortens each shard more than it does the leg.
      #
      # A class is atomic to a shard, and the dealing weighs a class by the seconds its tests
      # took when this runner last ran them (see the Test step). One class whose every test
      # runs for minutes on the slow runners, as the implementation flow's do, still weighs what
      # many of the suite's other classes do together, and no shard can be lighter than it; so
      # the flow's tests are held in batteries, each a class of its own
      # (ImplementationFlowTests+Planning and its siblings), which the dealing spreads; when
      # one grows until its shard nears the step's limit, the answer is more shards, or that
      # battery split again - never a longer limit.
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, shards: 1 }           # Linux x86_64
          - { os: ubuntu-24.04-arm, shard: 1, shards: 1 }        # Linux arm64
          - { os: windows-latest, shard: 1, shards: 2 }          # Windows x86_64
          - { os: windows-latest, shard: 2, shards: 2 }
          - { os: windows-11-vs2026-arm, shard: 1, shards: 3 }   # Windows arm64
          - { os: windows-11-vs2026-arm, shard: 2, shards: 3 }
          - { os: windows-11-vs2026-arm, shard: 3, shards: 3 }
          - { os: macos-26-intel, shard: 1, shards: 8 }          # macOS x86_64
          - { os: macos-26-intel, shard: 2, shards: 8 }
          - { os: macos-26-intel, shard: 3, shards: 8 }
          - { os: macos-26-intel, shard: 4, shards: 8 }
          - { os: macos-26-intel, shard: 5, shards: 8 }
          - { os: macos-26-intel, shard: 6, shards: 8 }
          - { os: macos-26-intel, shard: 7, shards: 8 }
          - { os: macos-26-intel, shard: 8, shards: 8 }
          - { os: macos-latest, shard: 1, shards: 3 }            # macOS arm64
          - { os: macos-latest, shard: 2, shards: 3 }
          - { os: macos-latest, shard: 3, shards: 3 }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so no credential is left in the working copy for the
          # code under test to find.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DssHarness.slnx

      - name: Build
        # Warnings are errors and NuGet auditing is on, so a newly disclosed advisory
        # against a pinned dependency fails here rather than shipping.
        run: dotnet build DssHarness.slnx --configuration Release --no-restore

      - name: Build tools
        # The end-to-end tests build a real CMake project with ninja and the runner's own C and C++ compilers - on
        # Windows with MinGW's and with Visual Studio's - and here a runner lacking one fails them (see the variable
        # the Test step sets) rather than skipping them green. Every image carries cmake and its compilers; ninja is
        # installed where an image carries none, as the arm64 Linux image's own list of what it holds says it does not.
        shell: bash
        run: |
          command -v ninja >/dev/null && exit 0

          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install --yes ninja-build ;;
            macOS) brew install ninja ;;
            Windows) choco install ninja --yes --no-progress ;;
          esac

      - name: Isolation
        # The tests of an agent's isolation run the system's bubblewrap for real, and here a runner lacking it fails them
        # (see the variable the Test step sets) rather than skipping them green. No Linux image carries it, and where
        # Ubuntu restricts unprivileged user namespaces the AppArmor profile for it is loaded - the remedy the tool names:
        # in place where the apparmor package ships it there (Ubuntu 25.04 and later), copied first from the
        # apparmor-profiles package's extra profiles where it does not (Ubuntu 24.04).
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            profile=/etc/apparmor.d/bwrap-userns-restrict

            if [ ! -f "$profile" ]; then
              sudo apt-get install --yes apparmor-profiles
              sudo cp /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/
            fi

            sudo apparmor_parser -r "$profile"
          fi

      - name: Restore test times
        # What each test class took when this runner last ran it, which the Test step deals the shards by: the newest
        # file any shard of this runner saved, each holding every class's time - its own shard's measured anew, the rest
        # as it found them. None the first time, and the dealing then weighs a class by the tests it holds.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-times
          key: test-times-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          restore-keys: test-times-${{ matrix.os }}-

      - name: Test
        # The suite's own executable, which exits non-zero when any test fails: never through
        # dotnet, which the suite then finds running it and starts its children with by path.
        # Run directly, it says what dotnet test keeps to itself: each test still running after
        # two minutes, named again every two minutes it runs on, and the slowest tests once the
        # run ends. And it is stopped short of the job's own limit: a job that limit ended kept
        # no log, so nothing said which test had hung. The limit is not how a hang is found -
        # the two-minute notice names it - and it sits well above the slowest shard, whose own
        # time wanders: the Intel macOS runner's time over one suite has varied by half again
        # between runs with no test hung and its slowest test under two minutes. Its time grows
        # with the suite and wanders with the runner; more shards, not a longer limit, are the
        # answer when a shard nears it.
        #
        # A shard is a set of whole test classes. The classes are dealt out heaviest first, each
        # to the shard lightest so far, in one order on every runner, so a runner's shards
        # together run every class once. A class weighs the seconds its tests took when this
        # runner last ran them (the Restore test times step): how many tests a class holds says
        # nothing of how long they run - a class of rebases or of flows runs a minute a test where
        # another runs a millisecond, and dealt by counts the heavy ones met in one shard, which
        # ran past the step's limit while another of the same runner ended in twenty minutes. A
        # class this runner never timed weighs its tests and one more for itself, at the seconds a
        # test of the classes it timed took on average; where it timed none, counts alone. A
        # shard that holds no class fails the step rather than running nothing green.
        timeout-minutes: 75
        shell: bash
        env:
          # A runner is meant to hold cmake, ninja and a compiler: a test that really builds fails here where one is
          # lacking, and is skipped only on a developer's machine that has none.
          DSSHARNESS_TESTS_REQUIRE_BUILD_TOOLS: "1"
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          # No -u: bash 3.2, macOS's own, reads an empty "$@" as unset.
          set -eo pipefail
          suite=./build/bin/dss-harness-test/release/dss-harness-test${{ runner.os == 'Windows' && '.exe' || '' }}

          # The lists are kept outside the checkout, which some tests read. Listing runs no test,
          # which the suite's runner reports as exit 8.
          "$suite" --xunit-list classes --ignore-exit-code 8 | tr -d '\r' \
            | grep -E '^[A-Za-z_][A-Za-z0-9_.+`]*$' | LC_ALL=C sort > "$RUNNER_TEMP/test-classes.txt"

          # How many tests each class holds: a test's name is its class's, a dot, its method's,
          # and a theory's arguments in brackets.
          "$suite" --list-tests --ignore-exit-code 8 | tr -d '\r' \
            | awk '/^  [A-Za-z_]/ && !/^  duration:/ {
                name = substr($0, 3); at = index(name, "(")
                if (at) name = substr(name, 1, at - 1)
                sub(/\.[^.]*$/, "", name); held[name]++
              }
              END { for (name in held) print held[name], name }' > "$RUNNER_TEMP/test-weights.txt"

          # The seconds each class took when this runner last ran it, as the Keep test times step wrote them.
          mkdir -p "$RUNNER_TEMP/test-times"
          times="$RUNNER_TEMP/test-times/times.txt"
          [ -f "$times" ] || : > "$times"

          awk -v weights="$RUNNER_TEMP/test-weights.txt" -v times="$times" '
            BEGIN {
              while ((getline line < weights) > 0) { split(line, field, " "); held[field[2]] = field[1] }
              while ((getline line < times) > 0) { split(line, field, " "); took[field[2]] = field[1] }
            }
            { classes[++n] = $0 }
            END {
              for (i = 1; i <= n; i++) if (classes[i] in took) { seconds += took[classes[i]]; counted += held[classes[i]] + 1 }
              rate = seconds > 0 ? seconds / counted : 1
              for (i = 1; i <= n; i++) {
                class = classes[i]
                printf "%.3f %s\n", (class in took ? took[class] : (held[class] + 1) * rate), class
              }
            }' "$RUNNER_TEMP/test-classes.txt" \
            | LC_ALL=C sort -k1,1nr -k2,2 \
            | awk -v n="$SHARDS" -v i="$SHARD" '{
                least = 1
                for (s = 2; s <= n; s++) if (load[s] < load[least]) least = s
                load[least] += $1
                if (least == i) print $2
              }' > "$RUNNER_TEMP/test-shard.txt"

          set --
          while IFS= read -r class; do
            set -- "$@" "$class"
          done < "$RUNNER_TEMP/test-shard.txt"

          if [ "$#" -eq 0 ]; then
            echo "::error::Shard $SHARD of $SHARDS holds no test class: the suite listed $(wc -l < "$RUNNER_TEMP/test-classes.txt" | tr -d ' ')."
            exit 1
          fi

          echo "Shard $SHARD of $SHARDS: $# of $(wc -l < "$RUNNER_TEMP/test-classes.txt" | tr -d ' ') test classes."
          # Bounded by the suite itself short of the step's limit, a shard past its time ends aborted with what it ran
          # reported - its slowest tests among it - and the Keep test times step times its classes from that report.
          "$suite" --xunit-diagnostics on --long-running 120 --show-slowest-tests 20 --timeout 70m \
            --report-xunit-junit --report-xunit-junit-filename shard.xml --results-directory "$RUNNER_TEMP/test-report" \
            --filter-class "$@"

      - name: Keep test times
        # What each class of this shard took, for the next run's dealing: written over the times this run was dealt by,
        # each class the suite still lists kept - this shard's as the report says them, the rest as they were - so the
        # file saved holds every class, and whichever shard's is restored next deals the whole suite. A class the suite's
        # own bound cut short weighs as though the tests it never ran took what its others did; a shard that wrote no
        # report leaves its classes the times they had.
        id: keep
        if: always()
        shell: bash
        run: |
          set -eo pipefail
          report="$RUNNER_TEMP/test-report/shard.xml"
          times="$RUNNER_TEMP/test-times/times.txt"
          [ -f "$report" ] && [ -f "$times" ] || exit 0

          # The report is one line of XML: each test case's class and seconds, summed by class.
          tr '<' '\n' < "$report" | awk -v times="$times" -v classes="$RUNNER_TEMP/test-classes.txt" -v weights="$RUNNER_TEMP/test-weights.txt" '
            BEGIN {
              while ((getline line < classes) > 0) listed[line] = 1
              while ((getline line < weights) > 0) { split(line, field, " "); held[field[2]] = field[1] }
              while ((getline line < times) > 0) { split(line, field, " "); took[field[2]] = field[1] }
            }
            /^testcase / {
              if (!match($0, / time="[^"]*"/)) next
              seconds = substr($0, RSTART + 7, RLENGTH - 8)
              if (!match($0, / classname="[^"]*"/)) next
              class = substr($0, RSTART + 12, RLENGTH - 13)
              fresh[class] += seconds
              ran[class]++
            }
            END {
              for (class in fresh) took[class] = held[class] > ran[class] ? fresh[class] * held[class] / ran[class] : fresh[class]
              for (class in took) if (class in listed) printf "%.3f %s\n", took[class], class
            }' | LC_ALL=C sort -k2,2 > "$times.next"

          mv "$times.next" "$times"
          echo "kept=true" >> "$GITHUB_OUTPUT"

      - name: Save test times
        if: always() && steps.keep.outputs.kept == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-times
          key: test-times-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
