# The implementation workflow: from a request to a pull request whose checks are green -
# triage, a plan that is audited and approved, each work item built in an agent of
# its own and reviewed, the gate, a self-audit, the handoff, the pull request, and
# its checks. Written by 'dssharness init'; every path this file names is relative
# to this workflow's own directory.
#
# A run of it ends done, or asks a person only what a person must settle. Every step of
# the flow says what its failure does, itself or through its group. A reasoning step
# asks ('onFailure: pause'); the graph of the codebase, the CI read and the catch-ups
# pass a failure over ('onFailure: continue'); every other step says 'onFailure: recover',
# which gives a failure no handler takes to 'recover', at the end of this file, where an
# agent finds what went wrong and, where the run can put it right, builds, reviews and
# folds the fix as a work item is; then the step that failed runs again
# ('onSuccess: failed-step'). A person is asked where the
# diagnosis says only a person can lift what stands in the way, with the advisor's
# recommendation and the choices; where a step still fails after five recoveries; and
# at the end, for what the run left. An issue a step meets that was there before the run is
# fixed at its root the same way where it is in the way, related to the work or critical,
# and otherwise listed, proven, for the person ('onPreExisting', at the end of the flow).
#
# The item pipeline - an item built in an agent of its own, tested, reviewed, folded and
# checkpointed - is not written in this file: it is a workflow of its own,
# item-pipeline/item-pipeline.yml, used by the rounds and by the recovery alike ('use'), each
# use handing it its prompt, its failure's name and the facts of the run its steps read.
name: implementation
description: From a request to a pull request whose checks are green - triage, a plan that is audited and approved, each work item built in an agent of its own and reviewed, the gate, a self-audit, the handoff, the pull request, and its checks.
maxReasoningAgents: 4
maxParallelProcesses: 2
maxOpenAgents: 4
maxRetries: 3
# Every agent this file runs - each reasoning step, the advisor, the reporter - says how it is
# tried again where it failed: three times on each model it may use, waiting 30 seconds before
# the first retry and twice as long before each later one, before its fallback's next model, and
# only then asks (onFailure: pause). These two are what a step a repository adds gets where it
# says neither.
backoffSeconds: 30
maxInstances: 12000
pushCheckpoints: false
# The workflow's texts: prose a prompt reads by name - {text.<name>} - beside the bar
# for recommendations, which every prompt that recommends reads as {recommendations}
# still, as it always did. closure.md is the repository's own from the day it is
# written: the universe its decisions range over, and what else judges them.
texts:
  recommendations: recommendations.md
  closure: closure.md
advisor:
  agent: advisor
  tier: high
  effort: high
  prompt: prompts/recommend.md
  retries: 3
  backoffSeconds: 30
reporter:
  agent: reporter
  tier: fast
  effort: low
  statusPrompt: prompts/status.md
  askPrompt: prompts/ask.md
  retries: 3
  backoffSeconds: 30
amend:
  input: request
  changedAnswerMinutes: 1
  before: notes
  step: planning.plan-update
  then: check
  scope: 'plan.latest.scope'
  whenAddScope: rounds.items.implement
  whenChangeScope: rounds.items.redo
  whenRemoveScope: rounds.items.undo
  maxAddedIterations: 1
answers:
  # A reasoning step at a limit of its own is given a new conversation, or a compacted
  # one; past these the limit is asked, with the advisor's recommendation. A reasoning
  # step is never recovered: a failed agent is tried again on its model and then on each
  # model of its fallback; an account at its limit for every model, or a provider that
  # fails, is a pause that resumes it; and where it still fails, it asks (onFailure: pause).
  turnLimit:
    answer: retry
    times: 2
  truncated:
    answer: retry
    times: 2
  contextLimit:
    answer: compact
    times: 3
inputs:
  - name: request
    description: What to do, in words; --input request=@<file> reads it from a file. Empty, the prioritiser chooses the work from the handoff, the backlog and what is red.
    default: ''
  - name: plan
    kind: file
    description: An implementation plan a person wrote for this request; empty, the plan is the one the request holds, or the planner makes one.
    default: ''
  - name: preapproved
    description: 'yes: the plan is approved beforehand, and nobody is asked to approve it. no: a person approves it, whatever the request says. Left empty, a person approves it unless the request itself says in plain words that its plan is approved beforehand.'
    options: [yes, 'no']
    default: ''
  - name: handoff
    description: The tracked file the handoff is written to, and the next run reads.
    default: docs/handoff.md
  - name: backlog
    description: A tracked file of work to choose from, and where what the reviews and the audit left is written; empty, there is none.
    default: ''
  - name: affectedTests
    description: 'on: each work item is tested on the tests its change affects, the filter its plan names, and every test runs once every item of the round is built. off: every test runs for each item.'
    options: ['on', 'off']
    default: 'off'
steps:
  - name: orient
    type: orient
    onFailure: recover
  - name: build
    type: build
    dependsOn: [orient]
    when: 'orient.hasLegs'
    alone: true
    onFailure: recover
  - name: codebase
    type: graphify-codebase
    dependsOn: [build]
    onFailure: continue
  - name: baseline
    type: test
    dependsOn: [build]
    when: 'orient.hasLegs'
    alone: true
    failOn: never
    skippable: true
    onFailure: recover
  - name: ci
    type: ci-read
    dependsOn: [orient]
    when: 'orient.ciConfigured'
    branch: '{orient.baseBranch}'
    failOn: never
    skippable: true
    onFailure: continue
  - name: intake
    dependsOn: [codebase, baseline, ci]
    gather: [blockers, stops]
    onFailure: recover
    steps:
      - name: priority
        type: reason
        agent: prioritizer
        tier: high
        effort: high
        when: 'empty(input.request)'
        retries: 3
        backoffSeconds: 30
        onFailure: pause
        onPreExisting: triage-pre-existing-issue
        graph: map
        prompt: prompts/priority.md
        outputs: schemas/priority.schema.json
      - name: triage
        type: reason
        graph: off
        agent: triage
        tier: high
        effort: high
        ask: true
        dependsOn: [priority]
        retries: 3
        backoffSeconds: 30
        onFailure: pause
        onPreExisting: triage-pre-existing-issue
        prompt: prompts/triage.md
        outputs: schemas/triage.schema.json
  - name: blocked
    type: pause
    person: true
    dependsOn: [intake]
    when: '!empty(intake.stops)'
    onFailure: recover
    question: |-
      '{intake.triage.title}' waits on what this run cannot settle by itself. Answer continue, with what you decide for each.
    questions: 'intake.stops'
    options: [continue]
    text: [continue]
  - name: planning
    dependsOn: [blocked]
    repeat:
      until: "check.ok && plan-audit.go && approval.answer == 'approve'"
      maxIterations: 3
    onFailure: recover
    steps:
      - name: plan
        type: reason
        agent: planner
        tier: best
        effort: xhigh
        ask: true
        resume: plan
        retries: 3
        backoffSeconds: 30
        onFailure: pause
        onPreExisting: triage-pre-existing-issue
        prompt: prompts/plan.md
        resumePrompt: prompts/replan.md
        outputs: schemas/plan.schema.json
      - name: check
        type: validate-plan
        dependsOn: [plan]
        items: 'plan.latest.items'
        scope: 'plan.latest.scope'
        onFailure: recover
      - name: plan-audit
        type: reason
        graph: off
        agent: plan-auditor
        tier: high
        effort: xhigh
        independent: true
        dependsOn: [check]
        retries: 3
        backoffSeconds: 30
        onFailure: pause
        onPreExisting: triage-pre-existing-issue
        prompt: prompts/plan-audit.md
        outputs: schemas/plan-audit.schema.json
      - name: approval
        type: pause
        person: true
        dependsOn: [check, plan-audit]
        when: 'check.ok && plan-audit.go'
        preAnswer:
          - when: "input.preapproved == 'yes'"
            answer: approve
          - when: "input.preapproved != 'no' && intake.triage.preapproval.given"
            answer: approve
            quote:
              text: 'intake.triage.preapproval.sentence'
              input: request
        onFailure: recover
        question: |-
          The plan for '{intake.triage.title}' passed its check and its audit.
          {plan.latest.summary}
          It is done when: {plan.latest.done}
          Answer approve to have it built, or revise with what to change.
        options: [approve, revise]
        text: [revise]
      - name: plan-update
        type: reason
        resume: plan
        ask: true
        retries: 3
        backoffSeconds: 30
        onFailure: pause
        onPreExisting: triage-pre-existing-issue
        prompt: prompts/plan-update.md
        outputs: schemas/plan.schema.json
  - name: rounds
    dependsOn: [planning]
    repeat:
      until: 'self-audit.clean && (gate.passed ?? true) && (mutations.passed ?? true) && empty(round-checks.findings)'
      maxIterations: 2
      leftover: 'self-audit.findings'
    answers:
      loopBound: accept
    onFailure: recover
    steps:
      - name: item-check
        type: validate-plan
        items: 'previous.self-audit.items ?? planning.plan.latest.items'
        onFailure: recover
      - name: item-problems
        type: pause
        dependsOn: [item-check]
        when: '!item-check.ok'
        # The planner was given the problems once; what is still wrong is built as it
        # is, and a fold or a test that it breaks goes to the agents that put it right.
        answers:
          pause: continue
        onFailure: recover
        question: |-
          This round's work items still do not pass the plan check, after the planner was given the problems to settle and its plan was audited and approved: {item-check.problems}
          Answer continue to build them as they are, or abort.
        options: [continue]
      - name: items
        dependsOn: [item-problems]
        forEach: 'item-check.items'
        onFailure: recover
        # The item pipeline, written once in item-pipeline/item-pipeline.yml and used here and by the
        # recovery below: each item is built in an agent of its own, tested, reviewed, folded and
        # checkpointed. This use builds an item with the implement prompt and holds redo and undo
        # ready as the alternatives a plan update runs in its builder's place; its machine steps'
        # failures go to the run's recovery (failTo).
        use: ./item-pipeline/item-pipeline.yml
        with:
          item: 'item'
          implementPrompt: prompts/implement.md
          alternatives: 'true'
          failTo: recover
          orient: 'orient'
          planSummary: 'planning.plan.latest.summary'
          affectedTests: 'input.affectedTests'
      - name: round-checks
        dependsOn: [items]
        when: 'orient.anchors'
        gather: [findings]
        onFailure: recover
        steps:
          - name: balance
            type: anchor-balance
            base: '{orient.startCommit}'
            failOn: never
          - name: citations
            type: anchor-citations
            failOn: never
      - name: gate
        type: test
        dependsOn: [items, round-checks]
        when: 'orient.hasLegs'
        alone: true
        failOn: never
        onFailure: recover
      - name: mutations
        type: check-mutations
        dependsOn: [gate]
        when: 'orient.hasLegs && orient.hasMutations && gate.passed'
        pending: true
        alone: true
        failOn: never
        onFailure: recover
      - name: self-audit
        type: reason
        agent: auditor
        tier: high
        effort: xhigh
        independent: true
        dependsOn: [gate, mutations]
        retries: 3
        backoffSeconds: 30
        onFailure: pause
        onPreExisting: triage-pre-existing-issue
        graphFrom: changes
        prompt: prompts/self-audit.md
        outputs: schemas/self-audit.schema.json
  - name: notes
    type: create-agent
    agent: scribe
    dependsOn: [rounds]
    onFailure: recover
  - name: deferrals
    type: reason
    agent: scribe
    tier: balanced
    effort: high
    access: write
    in: notes
    dependsOn: [notes]
    when: 'orient.anchors'
    retries: 3
    backoffSeconds: 30
    onFailure: pause
    onPreExisting: triage-pre-existing-issue
    graph: off
    prompt: prompts/deferrals.md
    outputs: schemas/summary.schema.json
  - name: handoff
    type: reason
    agent: scribe
    tier: balanced
    effort: high
    access: write
    in: notes
    dependsOn: [deferrals]
    retries: 3
    backoffSeconds: 30
    onFailure: pause
    onPreExisting: triage-pre-existing-issue
    graph: off
    prompt: prompts/handoff.md
    outputs: schemas/summary.schema.json
  - name: notes-fold
    type: fold
    of: notes
    allow:
      new: 'deferrals.latest.newRows'
    answers:
      foldNewRows: allow
      foldTwoChanges: merge
    dependsOn: [handoff]
    onFailure: recover
  - name: notes-checks
    dependsOn: [notes-fold]
    when: 'orient.anchors'
    gather: [findings]
    onFailure: recover
    steps:
      - name: balance
        type: anchor-balance
        base: '{orient.startCommit}'
        rows: 'notes-fold.rows'
      - name: citations
        type: anchor-citations
        paths: 'notes-fold.written'
  - name: notes-cite
    type: reason
    resume: deferrals
    on:
      step: notes-checks
      outcome: failure
      codes: [1]
    then: notes-fold
    maxVisits: 2
    retries: 3
    backoffSeconds: 30
    onFailure: pause
    onPreExisting: triage-pre-existing-issue
    prompt: prompts/anchors.md
    outputs: schemas/summary.schema.json
  - name: notes-release
    type: delete-agent
    of: notes
    discardUncommitted: true
    dependsOn: [notes-checks]
    onFailure: recover
  - name: final-commit
    type: commit
    dependsOn: [notes-release]
    onFailure: recover
    message: |-
      {intake.triage.title}: handoff and deferrals

      Checked since the last commit:
      {carried.ran}
      Not checked:
      {carried.notRun}
      Known red:
      {carried.red}
  - name: final-push
    type: push
    dependsOn: [final-commit]
    when: 'orient.hasRemote'
    onFailure: recover
  - name: pr
    type: pull-request
    dependsOn: [final-push]
    when: 'orient.hasRemote'
    onFailure: recover
    title: '{intake.triage.title}'
    body: prompts/pr-body.md
  - name: checks
    type: ci-wait
    dependsOn: [pr]
    when: 'orient.hasRemote && orient.ciConfigured'
    waitMinutes: 60
    answers:
      checksPending:
        answer: more
        times: 2
    onFailure: recover
  # Raised once for each issue a reasoning step reports as there before the run - never
  # scheduled, as the recovery is not. It checks the issue on the base commit, then gives it
  # to the recovery to fix at its root now (onAddress: recover) where it is in a step's way,
  # related to the work or critical; otherwise it is added, proven, to the run's
  # pre-existing-issues.json, shown in the pull request and the handoff.
  - name: triage-pre-existing-issue
    type: reason
    agent: pre-existing-triage
    tier: balanced
    effort: high
    raised: preExisting
    onAddress: recover
    retries: 3
    backoffSeconds: 30
    onFailure: pause
    prompt: prompts/pre-existing.md
    outputs: schemas/pre-existing.schema.json
recover:
  # Reached by a failure of a step that says onFailure: recover - a test, a fold, a commit,
  # a push, the wait for the checks - and by an issue triage-pre-existing-issue sends to be
  # fixed; never by a reasoning step's own failure, which is tried again,
  # on its fallback, and then asked. Once its steps are done, the step that gave it its
  # failure runs again from where it stopped (onSuccess: failed-step), now that what stood
  # in its way was put right. Should that step fail again, its own onFailure: recover brings
  # it back here, to the diagnostician who saw the last attempt - until the step passes or
  # the diagnosis says only a person can lift what stands in the way. The recovery never
  # calls itself: its steps have their own retries, and where its own work still fails, a
  # person is asked (onFailure: pause). Past five recoveries of one step the run asks
  # (recoveryBound), with the advisor's recommendation of a fix and the choices.
  onSuccess: failed-step
  onFailure: pause
  maxVisits: 5
  steps:
    - name: diagnose
      type: reason
      agent: diagnostician
      tier: high
      effort: high
      resume: diagnose
      retries: 3
      backoffSeconds: 30
      onFailure: pause
      onPreExisting: triage-pre-existing-issue
      graphFrom: changes
      prompt: prompts/diagnose.md
      resumePrompt: prompts/rediagnose.md
      outputs: schemas/diagnosis.schema.json
    - name: direction
      type: pause
      person: true
      dependsOn: [diagnose]
      when: "diagnose.course == 'person'"
      question: |-
        '{source.step}' failed, and what stands in its way is a person's to settle.
        {diagnose.summary}
        The choices: {diagnose.choices}
        Answer retry once it was dealt with, to run the step again as it is; or continue, with what the run is to do.
      options: [retry, continue]
      text: [continue]
    - name: redirect
      type: reason
      resume: diagnose
      dependsOn: [direction]
      when: "(direction.answer ?? '') == 'continue'"
      retries: 3
      backoffSeconds: 30
      onFailure: pause
      onPreExisting: triage-pre-existing-issue
      graphFrom: changes
      prompt: prompts/redirect.md
      outputs: schemas/diagnosis.schema.json
    - name: remedies
      dependsOn: [redirect]
      when: "diagnose.latest.course == 'fix'"
      forEach: 'diagnose.latest.items'
      # The item pipeline again, used by the recovery as the rounds use it: each remedy is built in
      # an agent of its own, tested, reviewed, folded and checkpointed. This use builds one with the
      # remedy prompt, reading the diagnosis this step of the recovery hands it; its redo and undo
      # are held off, for no plan update reaches the recovery, and its machine steps' failures ask
      # (failTo: pause), for the recovery cannot call itself.
      use: ./item-pipeline/item-pipeline.yml
      with:
        item: 'item'
        implementPrompt: prompts/remedy.md
        alternatives: 'false'
        failTo: pause
        orient: 'orient'
        planSummary: 'planning.plan.latest.summary'
        affectedTests: 'input.affectedTests'
        diagnose: 'diagnose.latest'
    - name: publish
      type: push
      dependsOn: [remedies]
      when: "orient.hasRemote && !empty(pr.url) && diagnose.latest.course == 'fix'"
