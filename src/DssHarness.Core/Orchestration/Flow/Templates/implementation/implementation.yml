# The implementation workflow: from a request to a pull request whose checks are green -
# triage, a plan that is audited and approved, each work item built in an agent of
# its own and reviewed, the gate, a self-audit, the handoff, the pull request, and
# its checks. Written by 'dssharness init'; every path this file names is relative
# to this workflow's own directory.
#
# A run of it ends done, or asks a person only what a person must settle. Every step of
# the flow says what its failure does, itself or through its group: 'onFailure: recover'
# on every step but a reasoning one, the CI read and the catch-ups gives a failure no handler takes to
# 'recover', at the end of this file, where an agent finds what went wrong and, where the
# run can put it right, builds, reviews and folds the fix as a work item is; then the
# step that failed runs again ('onSuccess: failed-step'). A person is asked where the
# diagnosis says only a person can lift what stands in the way, with the advisor's
# recommendation and the choices; where a step still fails after five recoveries; and
# at the end, for what the run left. An issue a step meets that was there before the run is
# fixed at its root the same way where it is in the way, related to the work or critical,
# and otherwise listed, proven, for the person ('onPreExisting', at the end of the flow).
name: implementation
description: From a request to a pull request whose checks are green - triage, a plan that is audited and approved, each work item built in an agent of its own and reviewed, the gate, a self-audit, the handoff, the pull request, and its checks.
maxReasoningAgents: 4
maxParallelProcesses: 2
maxOpenAgents: 4
maxRetries: 3
# Every agent this file runs - each reasoning step, the advisor, the reporter - says how it is
# tried again where it failed: three times on each model it may use, waiting 30 seconds before
# the first retry and twice as long before each later one, before its fallback's next model, and
# only then asks (onFailure: pause). These two are what a step a repository adds gets where it
# says neither.
backoffSeconds: 30
maxInstances: 12000
pushCheckpoints: false
recommendations: recommendations.md
advisor:
  agent: advisor
  tier: best
  effort: high
  prompt: prompts/recommend.md
  retries: 3
  backoffSeconds: 30
reporter:
  agent: reporter
  tier: fast
  effort: low
  statusPrompt: prompts/status.md
  askPrompt: prompts/ask.md
  retries: 3
  backoffSeconds: 30
amend:
  input: request
  changedAnswerMinutes: 1
  before: notes
  step: planning.plan-update
  then: check
  scope: 'plan.latest.scope'
  whenAddScope: rounds.items.implement
  whenChangeScope: rounds.items.redo
  whenRemoveScope: rounds.items.undo
  maxAddedIterations: 1
answers:
  # A reasoning step at a limit of its own is given a new conversation, or a compacted
  # one; past these the limit is asked, with the advisor's recommendation. A reasoning
  # step is never recovered: a failed agent is tried again on its model and then on each
  # model of its fallback; an account at its limit for every model, or a provider that
  # fails, is a pause that resumes it; and where it still fails, it asks (onFailure: pause).
  turnLimit:
    answer: retry
    times: 2
  truncated:
    answer: retry
    times: 2
  contextLimit:
    answer: compact
    times: 3
inputs:
  - name: request
    description: What to do, in words; --input request=@<file> reads it from a file. Empty, the prioritiser chooses the work from the handoff, the backlog and what is red.
    default: ''
  - name: plan
    kind: file
    description: An implementation plan a person wrote for this request; empty, the plan is the one the request holds, or the planner makes one.
    default: ''
  - name: preapproved
    description: 'yes: the plan is approved beforehand, and nobody is asked to approve it. no: a person approves it, whatever the request says. Left empty, a person approves it unless the request itself says in plain words that its plan is approved beforehand.'
    options: [yes, 'no']
    default: ''
  - name: handoff
    description: The tracked file the handoff is written to, and the next run reads.
    default: docs/handoff.md
  - name: backlog
    description: A tracked file of work to choose from, and where what the reviews and the audit left is written; empty, there is none.
    default: ''
steps:
  - name: orient
    type: orient
    onFailure: recover
  - name: baseline
    type: test
    dependsOn: [orient]
    when: 'orient.hasLegs'
    alone: true
    failOn: never
    skippable: true
    onFailure: recover
  - name: ci
    type: ci-read
    dependsOn: [orient]
    when: 'orient.ciConfigured'
    branch: '{orient.baseBranch}'
    failOn: never
    skippable: true
    onFailure: continue
  - name: intake
    dependsOn: [baseline, ci]
    gather: [blockers, stops]
    onFailure: recover
    steps:
      - name: priority
        type: reason
        agent: prioritizer
        tier: best
        effort: high
        when: 'empty(input.request)'
        retries: 3
        backoffSeconds: 30
        onFailure: pause
        onPreExisting: triage-pre-existing-issue
        prompt: prompts/priority.md
        outputs: schemas/priority.schema.json
      - name: triage
        type: reason
        agent: triage
        tier: best
        effort: high
        ask: true
        dependsOn: [priority]
        retries: 3
        backoffSeconds: 30
        onFailure: pause
        onPreExisting: triage-pre-existing-issue
        prompt: prompts/triage.md
        outputs: schemas/triage.schema.json
  - name: blocked
    type: pause
    person: true
    dependsOn: [intake]
    when: '!empty(intake.stops)'
    onFailure: recover
    question: |-
      '{intake.triage.title}' waits on what this run cannot settle by itself. Answer continue, with what you decide for each.
    questions: 'intake.stops'
    options: [continue]
    text: [continue]
  - name: planning
    dependsOn: [blocked]
    repeat:
      until: "check.ok && plan-audit.go && approval.answer == 'approve'"
      maxIterations: 3
    onFailure: recover
    steps:
      - name: plan
        type: reason
        agent: planner
        tier: best
        effort: max
        ask: true
        resume: plan
        retries: 3
        backoffSeconds: 30
        onFailure: pause
        onPreExisting: triage-pre-existing-issue
        prompt: prompts/plan.md
        resumePrompt: prompts/replan.md
        outputs: schemas/plan.schema.json
      - name: check
        type: validate-plan
        dependsOn: [plan]
        items: 'plan.latest.items'
        scope: 'plan.latest.scope'
        onFailure: recover
      - name: plan-audit
        type: reason
        agent: plan-auditor
        tier: best
        effort: max
        independent: true
        dependsOn: [check]
        retries: 3
        backoffSeconds: 30
        onFailure: pause
        onPreExisting: triage-pre-existing-issue
        prompt: prompts/plan-audit.md
        outputs: schemas/plan-audit.schema.json
      - name: approval
        type: pause
        person: true
        dependsOn: [check, plan-audit]
        when: 'check.ok && plan-audit.go'
        preAnswer:
          - when: "input.preapproved == 'yes'"
            answer: approve
          - when: "input.preapproved != 'no' && intake.triage.preapproval.given"
            answer: approve
            quote:
              text: 'intake.triage.preapproval.sentence'
              input: request
        onFailure: recover
        question: |-
          The plan for '{intake.triage.title}' passed its check and its audit.
          {plan.latest.summary}
          It is done when: {plan.latest.done}
          Answer approve to have it built, or revise with what to change.
        options: [approve, revise]
        text: [revise]
      - name: plan-update
        type: reason
        resume: plan
        ask: true
        retries: 3
        backoffSeconds: 30
        onFailure: pause
        onPreExisting: triage-pre-existing-issue
        prompt: prompts/plan-update.md
        outputs: schemas/plan.schema.json
  - name: rounds
    dependsOn: [planning]
    repeat:
      until: 'self-audit.clean && (gate.passed ?? true) && (mutations.passed ?? true) && empty(round-checks.findings)'
      maxIterations: 2
      leftover: 'self-audit.findings'
    answers:
      loopBound: accept
    onFailure: recover
    steps:
      - name: item-check
        type: validate-plan
        items: 'previous.self-audit.items ?? planning.plan.latest.items'
        onFailure: recover
      - name: item-problems
        type: pause
        dependsOn: [item-check]
        when: '!item-check.ok'
        # The planner was given the problems once; what is still wrong is built as it
        # is, and a fold or a test that it breaks goes to the agents that put it right.
        answers:
          pause: continue
        onFailure: recover
        question: |-
          This round's work items still do not pass the plan check, after the planner was given the problems to settle and its plan was audited and approved: {item-check.problems}
          Answer continue to build them as they are, or abort.
        options: [continue]
      - name: items
        dependsOn: [item-problems]
        forEach: 'item-check.items'
        onFailure: recover
        steps:
          - name: item-agent
            type: create-agent
            agent: implementer
            onFailure: recover
          - name: implement
            type: reason
            agent: implementer
            tier: balanced
            effort: max
            access: write
            in: item-agent
            writes: 'item.ownedPaths'
            dependsOn: [item-agent]
            retries: 3
            backoffSeconds: 30
            onFailure: pause
            onPreExisting: triage-pre-existing-issue
            prompt: prompts/implement.md
            outputs: schemas/implement.schema.json
          - name: redo
            type: reason
            agent: implementer
            tier: balanced
            effort: max
            access: write
            in: item-agent
            writes: 'item.ownedPaths'
            retries: 3
            backoffSeconds: 30
            onFailure: pause
            onPreExisting: triage-pre-existing-issue
            prompt: prompts/redo.md
            outputs: schemas/implement.schema.json
          - name: undo
            type: reason
            agent: implementer
            tier: balanced
            effort: max
            access: write
            in: item-agent
            writes: 'item.ownedPaths'
            retries: 3
            backoffSeconds: 30
            onFailure: pause
            onPreExisting: triage-pre-existing-issue
            prompt: prompts/undo.md
            outputs: schemas/implement.schema.json
          - name: item-blocked
            type: pause
            dependsOn: [implement]
            when: '!empty(implement.latest.blocked)'
            onFailure: recover
            question: |-
              The work on '{item.title}' cannot go on as planned: its builder says it cannot do part of it.
              {implement.latest.blocked}
              Answer continue, with what it is to do instead or what was done to lift what stands in its way; skip, to leave this item out of the run, listed as not done; or abort.
            options: [continue, skip]
            text: [continue]
          - name: unblock
            type: reason
            resume: implement
            on:
              step: item-blocked
              outcome: success
            when: "item-blocked.answer == 'continue'"
            then: item-blocked
            retries: 3
            backoffSeconds: 30
            onFailure: pause
            onPreExisting: triage-pre-existing-issue
            prompt: prompts/unblock.md
            outputs: schemas/implement.schema.json
          - name: verify
            type: test
            in: item-agent
            filter: '{item.testFilter}'
            dependsOn: [item-blocked]
            when: "orient.hasLegs && (item-blocked.answer ?? 'continue') != 'skip'"
            onFailure: recover
          - name: mend
            type: reason
            resume: implement
            on:
              step: verify
              outcome: failure
              codes: [20]
            then: item-blocked
            maxVisits: 3
            retries: 3
            backoffSeconds: 30
            onFailure: pause
            onPreExisting: triage-pre-existing-issue
            prompt: prompts/mend.md
            outputs: schemas/implement.schema.json
          - name: fold
            type: fold
            of: item-agent
            within: 'item.ownedPaths'
            allow:
              new: 'implement.latest.newRows'
            answers:
              foldNewRows: allow
              foldTwoChanges: merge
              foldConflicts: fail
              foldOutside: fail
            dependsOn: [verify, mend]
            when: "(item-blocked.answer ?? 'continue') != 'skip'"
            onFailure: recover
          - name: reconcile
            on:
              step: fold
              outcome: failure
              codes: [13]
            when: "fold.question == 'foldOutside' || fold.question == 'foldConflicts'"
            then: item-blocked
            maxVisits: 2
            onFailure: recover
            steps:
              - name: catch-up
                type: refresh
                of: item-agent
                all: true
                answers:
                  foldTwoChanges: merge
                  foldConflicts: fail
                onFailure: continue
              - name: settle
                type: reason
                resume: implement
                dependsOn: [catch-up]
                retries: 3
                backoffSeconds: 30
                onFailure: pause
                onPreExisting: triage-pre-existing-issue
                prompt: prompts/reconcile.md
                outputs: schemas/implement.schema.json
          - name: fold-checks
            dependsOn: [fold]
            when: "orient.anchors && (item-blocked.answer ?? 'continue') != 'skip'"
            gather: [findings]
            onFailure: recover
            steps:
              - name: balance
                type: anchor-balance
                base: '{orient.startCommit}'
                rows: 'fold.rows'
              - name: citations
                type: anchor-citations
                paths: 'fold.written'
          - name: cite
            type: reason
            resume: implement
            on:
              step: fold-checks
              outcome: failure
              codes: [1]
            then: item-blocked
            maxVisits: 2
            retries: 3
            backoffSeconds: 30
            onFailure: pause
            onPreExisting: triage-pre-existing-issue
            prompt: prompts/anchors.md
            outputs: schemas/implement.schema.json
          - name: checkpoint
            type: commit
            dependsOn: [fold-checks]
            onFailure: recover
            message: |-
              {item.title}

              Committed when the item was folded, before its review and the round's gate.
              Checked:
              {carried.ran}
              Not checked:
              {carried.notRun}
              Known red:
              {carried.red}
          - name: checkpoint-push
            type: push
            checkpoint: true
            dependsOn: [checkpoint]
            when: 'orient.hasRemote'
            onFailure: recover
          - name: fix
            dependsOn: [checkpoint-push]
            when: "(item-blocked.answer ?? 'continue') != 'skip'"
            repeat:
              until: 'empty(review.findings)'
              rounds: 3
              # Three rounds; past them the loop goes on only while a critical, high or medium finding
              # stands, three rounds more at most. What is left then - a low or a nit after the three,
              # anything after the six - is written to the backlog and named in the pull request and
              # the handoff, for the person who reads them at the end; the run goes on.
              blocking: "any(review.findings, it.severity != 'low' && it.severity != 'nit')"
              blockersLimitRounds: 3
              leftover: 'review.findings'
            answers:
              loopBound: accept
            onFailure: recover
            steps:
              - name: review-scope
                type: reason
                agent: review-scope
                tier: fast
                effort: low
                retries: 3
                backoffSeconds: 30
                onFailure: pause
                onPreExisting: triage-pre-existing-issue
                prompt: prompts/review-scope.md
                outputs: schemas/review-scope.schema.json
              - name: review
                dependsOn: [review-scope]
                gather: [findings]
                onFailure: recover
                steps:
                  - name: correctness
                    type: reason
                    agent: reviewer-correctness
                    tier: best
                    effort: max
                    independent: true
                    retries: 3
                    backoffSeconds: 30
                    onFailure: pause
                    onPreExisting: triage-pre-existing-issue
                    prompt: prompts/review.md
                    outputs: schemas/review.schema.json
                  - name: errors
                    type: reason
                    agent: reviewer-errors
                    tier: best
                    effort: max
                    independent: true
                    when: 'review-scope.errors'
                    retries: 3
                    backoffSeconds: 30
                    onFailure: pause
                    onPreExisting: triage-pre-existing-issue
                    prompt: prompts/review.md
                    outputs: schemas/review.schema.json
                  - name: tests
                    type: reason
                    agent: reviewer-tests
                    tier: best
                    effort: max
                    independent: true
                    when: 'review-scope.tests'
                    retries: 3
                    backoffSeconds: 30
                    onFailure: pause
                    onPreExisting: triage-pre-existing-issue
                    prompt: prompts/review.md
                    outputs: schemas/review.schema.json
                  - name: types
                    type: reason
                    agent: reviewer-types
                    tier: balanced
                    effort: high
                    independent: true
                    when: 'review-scope.types'
                    retries: 3
                    backoffSeconds: 30
                    onFailure: pause
                    onPreExisting: triage-pre-existing-issue
                    prompt: prompts/review.md
                    outputs: schemas/review.schema.json
                  - name: comments
                    type: reason
                    agent: reviewer-comments
                    tier: balanced
                    effort: high
                    independent: true
                    when: 'review-scope.comments'
                    retries: 3
                    backoffSeconds: 30
                    onFailure: pause
                    onPreExisting: triage-pre-existing-issue
                    prompt: prompts/review.md
                    outputs: schemas/review.schema.json
                  - name: simplicity
                    type: reason
                    agent: reviewer-simplicity
                    tier: balanced
                    effort: high
                    independent: true
                    when: 'review-scope.simplicity'
                    retries: 3
                    backoffSeconds: 30
                    onFailure: pause
                    onPreExisting: triage-pre-existing-issue
                    prompt: prompts/review.md
                    outputs: schemas/review.schema.json
              - name: revise
                dependsOn: [review]
                when: '!empty(review.findings)'
                onFailure: recover
                steps:
                  - name: rework
                    type: reason
                    resume: implement
                    retries: 3
                    backoffSeconds: 30
                    onFailure: pause
                    onPreExisting: triage-pre-existing-issue
                    prompt: prompts/rework.md
                    outputs: schemas/implement.schema.json
                  - name: reverify
                    type: test
                    in: item-agent
                    filter: '{item.testFilter}'
                    dependsOn: [rework]
                    when: 'orient.hasLegs'
                    onFailure: recover
                  - name: remend
                    type: reason
                    resume: implement
                    on:
                      step: reverify
                      outcome: failure
                      codes: [20]
                    then: reverify
                    maxVisits: 3
                    retries: 3
                    backoffSeconds: 30
                    onFailure: pause
                    onPreExisting: triage-pre-existing-issue
                    prompt: prompts/mend.md
                    outputs: schemas/implement.schema.json
                  - name: refold
                    type: fold
                    of: item-agent
                    within: 'item.ownedPaths'
                    allow:
                      new: 'implement.latest.newRows'
                    answers:
                      foldNewRows: allow
                      foldTwoChanges: merge
                      foldConflicts: fail
                      foldOutside: fail
                    dependsOn: [reverify, remend]
                    onFailure: recover
                  - name: rereconcile
                    on:
                      step: refold
                      outcome: failure
                      codes: [13]
                    when: "refold.question == 'foldOutside' || refold.question == 'foldConflicts'"
                    then: reverify
                    maxVisits: 2
                    onFailure: recover
                    steps:
                      - name: recatch-up
                        type: refresh
                        of: item-agent
                        all: true
                        answers:
                          foldTwoChanges: merge
                          foldConflicts: fail
                        onFailure: continue
                      - name: resettle
                        type: reason
                        resume: implement
                        dependsOn: [recatch-up]
                        retries: 3
                        backoffSeconds: 30
                        onFailure: pause
                        onPreExisting: triage-pre-existing-issue
                        prompt: prompts/reconcile.md
                        outputs: schemas/implement.schema.json
                  - name: recheck
                    dependsOn: [refold]
                    when: 'orient.anchors'
                    gather: [findings]
                    onFailure: recover
                    steps:
                      - name: balance
                        type: anchor-balance
                        base: '{orient.startCommit}'
                        rows: 'refold.rows'
                      - name: citations
                        type: anchor-citations
                        paths: 'refold.written'
                  - name: recite
                    type: reason
                    resume: implement
                    on:
                      step: recheck
                      outcome: failure
                      codes: [1]
                    then: reverify
                    maxVisits: 2
                    retries: 3
                    backoffSeconds: 30
                    onFailure: pause
                    onPreExisting: triage-pre-existing-issue
                    prompt: prompts/anchors.md
                    outputs: schemas/implement.schema.json
                  - name: recheckpoint
                    type: commit
                    dependsOn: [recheck]
                    onFailure: recover
                    message: |-
                      {item.title}: review fixes

                      Committed when the fixes were folded, before the next review and the round's gate.
                      Checked:
                      {carried.ran}
                      Not checked:
                      {carried.notRun}
                      Known red:
                      {carried.red}
                  - name: repush
                    type: push
                    checkpoint: true
                    dependsOn: [recheckpoint]
                    when: 'orient.hasRemote'
                    onFailure: recover
          - name: release
            type: delete-agent
            of: item-agent
            within: 'item.ownedPaths'
            allow:
              new: 'implement.latest.newRows'
            answers:
              foldNewRows: allow
              foldTwoChanges: merge
            dependsOn: [fix]
            when: "(item-blocked.answer ?? 'continue') != 'skip'"
            onFailure: recover
          - name: drop
            type: delete-agent
            of: item-agent
            discardUncommitted: true
            dependsOn: [item-blocked]
            when: "(item-blocked.answer ?? 'continue') == 'skip'"
            onFailure: recover
      - name: round-checks
        dependsOn: [items]
        when: 'orient.anchors'
        gather: [findings]
        onFailure: recover
        steps:
          - name: balance
            type: anchor-balance
            base: '{orient.startCommit}'
            failOn: never
          - name: citations
            type: anchor-citations
            failOn: never
      - name: gate
        type: test
        dependsOn: [items, round-checks]
        when: 'orient.hasLegs'
        alone: true
        failOn: never
        onFailure: recover
      - name: mutations
        type: check-mutations
        dependsOn: [gate]
        when: 'orient.hasLegs && orient.hasMutations && gate.passed'
        pending: true
        alone: true
        failOn: never
        onFailure: recover
      - name: self-audit
        type: reason
        agent: auditor
        tier: best
        effort: max
        independent: true
        dependsOn: [gate, mutations]
        retries: 3
        backoffSeconds: 30
        onFailure: pause
        onPreExisting: triage-pre-existing-issue
        prompt: prompts/self-audit.md
        outputs: schemas/self-audit.schema.json
  - name: notes
    type: create-agent
    agent: scribe
    dependsOn: [rounds]
    onFailure: recover
  - name: deferrals
    type: reason
    agent: scribe
    tier: balanced
    effort: high
    access: write
    in: notes
    dependsOn: [notes]
    when: 'orient.anchors'
    retries: 3
    backoffSeconds: 30
    onFailure: pause
    onPreExisting: triage-pre-existing-issue
    prompt: prompts/deferrals.md
    outputs: schemas/summary.schema.json
  - name: handoff
    type: reason
    agent: scribe
    tier: balanced
    effort: high
    access: write
    in: notes
    dependsOn: [deferrals]
    retries: 3
    backoffSeconds: 30
    onFailure: pause
    onPreExisting: triage-pre-existing-issue
    prompt: prompts/handoff.md
    outputs: schemas/summary.schema.json
  - name: notes-fold
    type: fold
    of: notes
    allow:
      new: 'deferrals.latest.newRows'
    answers:
      foldNewRows: allow
      foldTwoChanges: merge
    dependsOn: [handoff]
    onFailure: recover
  - name: notes-checks
    dependsOn: [notes-fold]
    when: 'orient.anchors'
    gather: [findings]
    onFailure: recover
    steps:
      - name: balance
        type: anchor-balance
        base: '{orient.startCommit}'
        rows: 'notes-fold.rows'
      - name: citations
        type: anchor-citations
        paths: 'notes-fold.written'
  - name: notes-cite
    type: reason
    resume: deferrals
    on:
      step: notes-checks
      outcome: failure
      codes: [1]
    then: notes-fold
    maxVisits: 2
    retries: 3
    backoffSeconds: 30
    onFailure: pause
    onPreExisting: triage-pre-existing-issue
    prompt: prompts/anchors.md
    outputs: schemas/summary.schema.json
  - name: notes-release
    type: delete-agent
    of: notes
    discardUncommitted: true
    dependsOn: [notes-checks]
    onFailure: recover
  - name: final-commit
    type: commit
    dependsOn: [notes-release]
    onFailure: recover
    message: |-
      {intake.triage.title}: handoff and deferrals

      Checked since the last commit:
      {carried.ran}
      Not checked:
      {carried.notRun}
      Known red:
      {carried.red}
  - name: final-push
    type: push
    dependsOn: [final-commit]
    when: 'orient.hasRemote'
    onFailure: recover
  - name: pr
    type: pull-request
    dependsOn: [final-push]
    when: 'orient.hasRemote'
    onFailure: recover
    title: '{intake.triage.title}'
    body: prompts/pr-body.md
  - name: checks
    type: ci-wait
    dependsOn: [pr]
    when: 'orient.hasRemote && orient.ciConfigured'
    waitMinutes: 60
    answers:
      checksPending:
        answer: more
        times: 2
    onFailure: recover
  # Raised once for each issue a reasoning step reports as there before the run - never
  # scheduled, as the recovery is not. It checks the issue on the base commit, then gives it
  # to the recovery to fix at its root now (onAddress: recover) where it is in a step's way,
  # related to the work or critical; otherwise it is added, proven, to the run's
  # pre-existing-issues.json, shown in the pull request and the handoff.
  - name: triage-pre-existing-issue
    type: reason
    agent: pre-existing-triage
    tier: balanced
    effort: high
    raised: preExisting
    onAddress: recover
    retries: 3
    backoffSeconds: 30
    onFailure: pause
    prompt: prompts/pre-existing.md
    outputs: schemas/pre-existing.schema.json
recover:
  # Reached by a failure of a step that says onFailure: recover - a test, a fold, a commit,
  # a push, the wait for the checks - and by an issue triage-pre-existing-issue sends to be
  # fixed; never by a reasoning step's own failure, which is tried again,
  # on its fallback, and then asked. Once its steps are done, the step that gave it its
  # failure runs again from where it stopped (onSuccess: failed-step), now that what stood
  # in its way was put right. Should that step fail again, its own onFailure: recover brings
  # it back here, to the diagnostician who saw the last attempt - until the step passes or
  # the diagnosis says only a person can lift what stands in the way. The recovery never
  # calls itself: its steps have their own retries, and where its own work still fails, a
  # person is asked (onFailure: pause). Past five recoveries of one step the run asks
  # (recoveryBound), with the advisor's recommendation of a fix and the choices.
  onSuccess: failed-step
  onFailure: pause
  maxVisits: 5
  steps:
    - name: diagnose
      type: reason
      agent: diagnostician
      tier: best
      effort: high
      resume: diagnose
      retries: 3
      backoffSeconds: 30
      onFailure: pause
      onPreExisting: triage-pre-existing-issue
      prompt: prompts/diagnose.md
      resumePrompt: prompts/rediagnose.md
      outputs: schemas/diagnosis.schema.json
    - name: direction
      type: pause
      person: true
      dependsOn: [diagnose]
      when: "diagnose.course == 'person'"
      question: |-
        '{source.step}' failed, and what stands in its way is a person's to settle.
        {diagnose.summary}
        The choices: {diagnose.choices}
        Answer retry once it was dealt with, to run the step again as it is; or continue, with what the run is to do.
      options: [retry, continue]
      text: [continue]
    - name: redirect
      type: reason
      resume: diagnose
      dependsOn: [direction]
      when: "(direction.answer ?? '') == 'continue'"
      retries: 3
      backoffSeconds: 30
      onFailure: pause
      onPreExisting: triage-pre-existing-issue
      prompt: prompts/redirect.md
      outputs: schemas/diagnosis.schema.json
    - name: remedies
      dependsOn: [redirect]
      when: "diagnose.latest.course == 'fix'"
      forEach: 'diagnose.latest.items'
      steps:
        - name: item-agent
          type: create-agent
          agent: implementer
        - name: implement
          type: reason
          agent: implementer
          tier: balanced
          effort: max
          access: write
          in: item-agent
          writes: 'item.ownedPaths'
          dependsOn: [item-agent]
          retries: 3
          backoffSeconds: 30
          onFailure: pause
          onPreExisting: triage-pre-existing-issue
          prompt: prompts/remedy.md
          outputs: schemas/implement.schema.json
        - name: item-blocked
          type: pause
          dependsOn: [implement]
          when: '!empty(implement.latest.blocked)'
          question: |-
            The work on '{item.title}' cannot go on as planned: its builder says it cannot do part of it.
            {implement.latest.blocked}
            Answer continue, with what it is to do instead or what was done to lift what stands in its way; skip, to leave this item out of the run, listed as not done; or abort.
          options: [continue, skip]
          text: [continue]
        - name: unblock
          type: reason
          resume: implement
          on:
            step: item-blocked
            outcome: success
          when: "item-blocked.answer == 'continue'"
          then: item-blocked
          retries: 3
          backoffSeconds: 30
          onFailure: pause
          onPreExisting: triage-pre-existing-issue
          prompt: prompts/unblock.md
          outputs: schemas/implement.schema.json
        - name: verify
          type: test
          in: item-agent
          filter: '{item.testFilter}'
          dependsOn: [item-blocked]
          when: "orient.hasLegs && (item-blocked.answer ?? 'continue') != 'skip'"
        - name: mend
          type: reason
          resume: implement
          on:
            step: verify
            outcome: failure
            codes: [20]
          then: item-blocked
          maxVisits: 3
          retries: 3
          backoffSeconds: 30
          onFailure: pause
          onPreExisting: triage-pre-existing-issue
          prompt: prompts/mend.md
          outputs: schemas/implement.schema.json
        - name: fold
          type: fold
          of: item-agent
          within: 'item.ownedPaths'
          allow:
            new: 'implement.latest.newRows'
          answers:
            foldNewRows: allow
            foldTwoChanges: merge
            foldConflicts: fail
            foldOutside: fail
          dependsOn: [verify, mend]
          when: "(item-blocked.answer ?? 'continue') != 'skip'"
        - name: reconcile
          on:
            step: fold
            outcome: failure
            codes: [13]
          when: "fold.question == 'foldOutside' || fold.question == 'foldConflicts'"
          then: item-blocked
          maxVisits: 2
          steps:
            - name: catch-up
              type: refresh
              of: item-agent
              all: true
              answers:
                foldTwoChanges: merge
                foldConflicts: fail
              onFailure: continue
            - name: settle
              type: reason
              resume: implement
              dependsOn: [catch-up]
              retries: 3
              backoffSeconds: 30
              onFailure: pause
              onPreExisting: triage-pre-existing-issue
              prompt: prompts/reconcile.md
              outputs: schemas/implement.schema.json
        - name: fold-checks
          dependsOn: [fold]
          when: "orient.anchors && (item-blocked.answer ?? 'continue') != 'skip'"
          gather: [findings]
          steps:
            - name: balance
              type: anchor-balance
              base: '{orient.startCommit}'
              rows: 'fold.rows'
            - name: citations
              type: anchor-citations
              paths: 'fold.written'
        - name: cite
          type: reason
          resume: implement
          on:
            step: fold-checks
            outcome: failure
            codes: [1]
          then: item-blocked
          maxVisits: 2
          retries: 3
          backoffSeconds: 30
          onFailure: pause
          onPreExisting: triage-pre-existing-issue
          prompt: prompts/anchors.md
          outputs: schemas/implement.schema.json
        - name: checkpoint
          type: commit
          dependsOn: [fold-checks]
          message: |-
            {item.title}

            Committed when the item was folded, before its review and the round's gate.
            Checked:
            {carried.ran}
            Not checked:
            {carried.notRun}
            Known red:
            {carried.red}
        - name: checkpoint-push
          type: push
          checkpoint: true
          dependsOn: [checkpoint]
          when: 'orient.hasRemote'
        - name: fix
          dependsOn: [checkpoint-push]
          when: "(item-blocked.answer ?? 'continue') != 'skip'"
          repeat:
            until: 'empty(review.findings)'
            rounds: 3
            # Three rounds; past them the loop goes on only while a critical, high or medium finding
            # stands, three rounds more at most. What is left then - a low or a nit after the three,
            # anything after the six - is written to the backlog and named in the pull request and
            # the handoff, for the person who reads them at the end; the run goes on.
            blocking: "any(review.findings, it.severity != 'low' && it.severity != 'nit')"
            blockersLimitRounds: 3
            leftover: 'review.findings'
          answers:
            loopBound: accept
          steps:
            - name: review-scope
              type: reason
              agent: review-scope
              tier: fast
              effort: low
              retries: 3
              backoffSeconds: 30
              onFailure: pause
              onPreExisting: triage-pre-existing-issue
              prompt: prompts/review-scope.md
              outputs: schemas/review-scope.schema.json
            - name: review
              dependsOn: [review-scope]
              gather: [findings]
              steps:
                - name: correctness
                  type: reason
                  agent: reviewer-correctness
                  tier: best
                  effort: max
                  independent: true
                  retries: 3
                  backoffSeconds: 30
                  onFailure: pause
                  onPreExisting: triage-pre-existing-issue
                  prompt: prompts/review.md
                  outputs: schemas/review.schema.json
                - name: errors
                  type: reason
                  agent: reviewer-errors
                  tier: best
                  effort: max
                  independent: true
                  when: 'review-scope.errors'
                  retries: 3
                  backoffSeconds: 30
                  onFailure: pause
                  onPreExisting: triage-pre-existing-issue
                  prompt: prompts/review.md
                  outputs: schemas/review.schema.json
                - name: tests
                  type: reason
                  agent: reviewer-tests
                  tier: best
                  effort: max
                  independent: true
                  when: 'review-scope.tests'
                  retries: 3
                  backoffSeconds: 30
                  onFailure: pause
                  onPreExisting: triage-pre-existing-issue
                  prompt: prompts/review.md
                  outputs: schemas/review.schema.json
                - name: types
                  type: reason
                  agent: reviewer-types
                  tier: balanced
                  effort: high
                  independent: true
                  when: 'review-scope.types'
                  retries: 3
                  backoffSeconds: 30
                  onFailure: pause
                  onPreExisting: triage-pre-existing-issue
                  prompt: prompts/review.md
                  outputs: schemas/review.schema.json
                - name: comments
                  type: reason
                  agent: reviewer-comments
                  tier: balanced
                  effort: high
                  independent: true
                  when: 'review-scope.comments'
                  retries: 3
                  backoffSeconds: 30
                  onFailure: pause
                  onPreExisting: triage-pre-existing-issue
                  prompt: prompts/review.md
                  outputs: schemas/review.schema.json
                - name: simplicity
                  type: reason
                  agent: reviewer-simplicity
                  tier: balanced
                  effort: high
                  independent: true
                  when: 'review-scope.simplicity'
                  retries: 3
                  backoffSeconds: 30
                  onFailure: pause
                  onPreExisting: triage-pre-existing-issue
                  prompt: prompts/review.md
                  outputs: schemas/review.schema.json
            - name: revise
              dependsOn: [review]
              when: '!empty(review.findings)'
              steps:
                - name: rework
                  type: reason
                  resume: implement
                  retries: 3
                  backoffSeconds: 30
                  onFailure: pause
                  onPreExisting: triage-pre-existing-issue
                  prompt: prompts/rework.md
                  outputs: schemas/implement.schema.json
                - name: reverify
                  type: test
                  in: item-agent
                  filter: '{item.testFilter}'
                  dependsOn: [rework]
                  when: 'orient.hasLegs'
                - name: remend
                  type: reason
                  resume: implement
                  on:
                    step: reverify
                    outcome: failure
                    codes: [20]
                  then: reverify
                  maxVisits: 3
                  retries: 3
                  backoffSeconds: 30
                  onFailure: pause
                  onPreExisting: triage-pre-existing-issue
                  prompt: prompts/mend.md
                  outputs: schemas/implement.schema.json
                - name: refold
                  type: fold
                  of: item-agent
                  within: 'item.ownedPaths'
                  allow:
                    new: 'implement.latest.newRows'
                  answers:
                    foldNewRows: allow
                    foldTwoChanges: merge
                    foldConflicts: fail
                    foldOutside: fail
                  dependsOn: [reverify, remend]
                - name: rereconcile
                  on:
                    step: refold
                    outcome: failure
                    codes: [13]
                  when: "refold.question == 'foldOutside' || refold.question == 'foldConflicts'"
                  then: reverify
                  maxVisits: 2
                  steps:
                    - name: recatch-up
                      type: refresh
                      of: item-agent
                      all: true
                      answers:
                        foldTwoChanges: merge
                        foldConflicts: fail
                      onFailure: continue
                    - name: resettle
                      type: reason
                      resume: implement
                      dependsOn: [recatch-up]
                      retries: 3
                      backoffSeconds: 30
                      onFailure: pause
                      onPreExisting: triage-pre-existing-issue
                      prompt: prompts/reconcile.md
                      outputs: schemas/implement.schema.json
                - name: recheck
                  dependsOn: [refold]
                  when: 'orient.anchors'
                  gather: [findings]
                  steps:
                    - name: balance
                      type: anchor-balance
                      base: '{orient.startCommit}'
                      rows: 'refold.rows'
                    - name: citations
                      type: anchor-citations
                      paths: 'refold.written'
                - name: recite
                  type: reason
                  resume: implement
                  on:
                    step: recheck
                    outcome: failure
                    codes: [1]
                  then: reverify
                  maxVisits: 2
                  retries: 3
                  backoffSeconds: 30
                  onFailure: pause
                  onPreExisting: triage-pre-existing-issue
                  prompt: prompts/anchors.md
                  outputs: schemas/implement.schema.json
                - name: recheckpoint
                  type: commit
                  dependsOn: [recheck]
                  message: |-
                    {item.title}: review fixes

                    Committed when the fixes were folded, before the next review and the round's gate.
                    Checked:
                    {carried.ran}
                    Not checked:
                    {carried.notRun}
                    Known red:
                    {carried.red}
                - name: repush
                  type: push
                  checkpoint: true
                  dependsOn: [recheckpoint]
                  when: 'orient.hasRemote'
        - name: release
          type: delete-agent
          of: item-agent
          within: 'item.ownedPaths'
          allow:
            new: 'implement.latest.newRows'
          answers:
            foldNewRows: allow
            foldTwoChanges: merge
          dependsOn: [fix]
          when: "(item-blocked.answer ?? 'continue') != 'skip'"
        - name: drop
          type: delete-agent
          of: item-agent
          discardUncommitted: true
          dependsOn: [item-blocked]
          when: "(item-blocked.answer ?? 'continue') == 'skip'"
    - name: publish
      type: push
      dependsOn: [remedies]
      when: "orient.hasRemote && !empty(pr.url) && diagnose.latest.course == 'fix'"
