# The default workflow: from a request to a pull request whose checks are green -
# triage, a plan that is audited and approved, each work item built in an agent of
# its own and reviewed, the gate, a self-audit, the handoff, the pull request, and
# its checks. Written by 'dssharness init'; every path this file names is relative
# to this workflow's own directory.
name: default
description: From a request to a pull request whose checks are green - triage, a plan that is audited and approved, each work item built in an agent of its own and reviewed, the gate, a self-audit, the handoff, the pull request, and its checks.
maxReasoningAgents: 4
maxParallelProcesses: 2
maxOpenAgents: 4
maxRetries: 3
maxInstances: 12000
pushCheckpoints: false
recommendations: recommendations.md
advisor:
  agent: advisor
  tier: best
  effort: high
  prompt: prompts/recommend.md
reporter:
  agent: reporter
  tier: fast
  effort: low
  statusPrompt: prompts/status.md
  askPrompt: prompts/ask.md
amend:
  input: request
  changedAnswerMinutes: 1
  before: notes
  step: planning.plan-update
  then: check
  scope: 'plan.latest.scope'
  whenAddScope: rounds.items.implement
  whenChangeScope: rounds.items.redo
  whenRemoveScope: rounds.items.undo
  maxAddedIterations: 1
answers:
  turnLimit:
    answer: retry
    times: 2
  truncated:
    answer: retry
    times: 2
  contextLimit:
    answer: compact
    times: 3
inputs:
  - name: request
    description: What to do, in words; --input request=@<file> reads it from a file. Empty, the prioritiser chooses the work from the handoff, the backlog and what is red.
    default: ''
  - name: plan
    kind: file
    description: An implementation plan a person wrote for this request; empty, the plan is the one the request holds, or the planner makes one.
    default: ''
  - name: preapproved
    description: 'yes: the plan is approved beforehand, and nobody is asked to approve it. no: a person approves it, whatever the request says. Left empty, a person approves it unless the request itself says in plain words that its plan is approved beforehand.'
    options: [yes, 'no']
    default: ''
  - name: handoff
    description: The tracked file the handoff is written to, and the next run reads.
    default: docs/handoff.md
  - name: backlog
    description: A tracked file of work to choose from, and where what the reviews and the audit left is written; empty, there is none.
    default: ''
steps:
  - name: orient
    type: orient
  - name: baseline
    type: test
    dependsOn: [orient]
    when: 'orient.hasLegs'
    alone: true
    failOn: never
    skippable: true
    onFailure: pause
  - name: ci
    type: ci-read
    dependsOn: [orient]
    when: 'orient.ciConfigured'
    branch: '{orient.baseBranch}'
    failOn: never
    skippable: true
    onFailure: continue
  - name: intake
    dependsOn: [baseline, ci]
    gather: [blockers, stops]
    steps:
      - name: priority
        type: reason
        agent: prioritizer
        tier: best
        effort: high
        when: 'empty(input.request)'
        prompt: prompts/priority.md
        outputs: schemas/priority.schema.json
      - name: triage
        type: reason
        agent: triage
        tier: best
        effort: high
        ask: true
        dependsOn: [priority]
        prompt: prompts/triage.md
        outputs: schemas/triage.schema.json
  - name: blocked
    type: pause
    person: true
    dependsOn: [intake]
    when: '!empty(intake.stops)'
    question: |-
      '{intake.triage.title}' waits on what this run cannot settle by itself. Answer continue, with what you decide for each.
    questions: 'intake.stops'
    options: [continue]
    text: [continue]
  - name: planning
    dependsOn: [blocked]
    repeat:
      until: "check.ok && plan-audit.go && approval.answer == 'approve'"
      maxIterations: 3
    steps:
      - name: plan
        type: reason
        agent: planner
        tier: best
        effort: max
        ask: true
        resume: plan
        prompt: prompts/plan.md
        resumePrompt: prompts/replan.md
        outputs: schemas/plan.schema.json
      - name: check
        type: validate-plan
        dependsOn: [plan]
        items: 'plan.latest.items'
        scope: 'plan.latest.scope'
      - name: plan-audit
        type: reason
        agent: plan-auditor
        tier: best
        effort: max
        independent: true
        dependsOn: [check]
        prompt: prompts/plan-audit.md
        outputs: schemas/plan-audit.schema.json
      - name: approval
        type: pause
        person: true
        dependsOn: [check, plan-audit]
        when: 'check.ok && plan-audit.go'
        preAnswer:
          - when: "input.preapproved == 'yes'"
            answer: approve
          - when: "input.preapproved != 'no' && intake.triage.preapproval.given"
            answer: approve
            quote:
              text: 'intake.triage.preapproval.sentence'
              input: request
        question: |-
          The plan for '{intake.triage.title}' passed its check and its audit.
          {plan.latest.summary}
          Answer approve to have it built, or revise with what to change.
        options: [approve, revise]
        text: [revise]
      - name: plan-update
        type: reason
        resume: plan
        ask: true
        onFailure: pause
        prompt: prompts/plan-update.md
        outputs: schemas/plan.schema.json
  - name: rounds
    dependsOn: [planning]
    repeat:
      until: 'self-audit.clean && (gate.passed ?? true) && (mutations.passed ?? true) && empty(round-checks.findings)'
      maxIterations: 2
      leftover: 'self-audit.findings'
    answers:
      loopBound: accept
    steps:
      - name: item-check
        type: validate-plan
        items: 'previous.self-audit.items ?? planning.plan.latest.items'
      - name: item-problems
        type: pause
        dependsOn: [item-check]
        when: '!item-check.ok'
        question: |-
          This round's work items still do not pass the plan check, after the planner was given the problems to settle and its plan was audited and approved: {item-check.problems}
          Answer continue to build them as they are, or abort.
        options: [continue]
      - name: items
        dependsOn: [item-problems]
        forEach: 'item-check.items'
        steps:
          - name: item-agent
            type: create-agent
            agent: implementer
          - name: implement
            type: reason
            agent: implementer
            tier: balanced
            effort: max
            access: write
            in: item-agent
            writes: 'item.ownedPaths'
            dependsOn: [item-agent]
            prompt: prompts/implement.md
            outputs: schemas/implement.schema.json
          - name: redo
            type: reason
            agent: implementer
            tier: balanced
            effort: max
            access: write
            in: item-agent
            writes: 'item.ownedPaths'
            prompt: prompts/redo.md
            outputs: schemas/implement.schema.json
          - name: undo
            type: reason
            agent: implementer
            tier: balanced
            effort: max
            access: write
            in: item-agent
            writes: 'item.ownedPaths'
            prompt: prompts/undo.md
            outputs: schemas/implement.schema.json
          - name: item-blocked
            type: pause
            dependsOn: [implement]
            when: '!empty(implement.latest.blocked)'
            question: |-
              The work on '{item.title}' cannot go on as planned: its builder says it cannot do part of it.
              {implement.latest.blocked}
              Answer continue, with what it is to do instead or what was done to lift what stands in its way; skip, to leave this item out of the run, listed as not done; or abort.
            options: [continue, skip]
            text: [continue]
          - name: unblock
            type: reason
            resume: implement
            on:
              step: item-blocked
              outcome: success
            when: "item-blocked.answer == 'continue'"
            then: item-blocked
            prompt: prompts/unblock.md
            outputs: schemas/implement.schema.json
          - name: verify
            type: test
            in: item-agent
            filter: '{item.testFilter}'
            dependsOn: [item-blocked]
            when: "orient.hasLegs && (item-blocked.answer ?? 'continue') != 'skip'"
            onFailure: pause
          - name: mend
            type: reason
            resume: implement
            on:
              step: verify
              outcome: failure
              codes: [20]
            then: item-blocked
            maxVisits: 3
            prompt: prompts/mend.md
            outputs: schemas/implement.schema.json
          - name: fold
            type: fold
            of: item-agent
            within: 'item.ownedPaths'
            allow:
              new: 'implement.latest.newRows'
            answers:
              foldNewRows: allow
              foldTwoChanges: merge
              foldConflicts: fail
              foldOutside: fail
            dependsOn: [verify, mend]
            when: "(item-blocked.answer ?? 'continue') != 'skip'"
            onFailure: pause
          - name: reconcile
            on:
              step: fold
              outcome: failure
              codes: [13]
            when: "fold.question == 'foldOutside' || fold.question == 'foldConflicts'"
            then: item-blocked
            maxVisits: 2
            onFailure: pause
            steps:
              - name: catch-up
                type: refresh
                of: item-agent
                all: true
                answers:
                  foldTwoChanges: merge
                  foldConflicts: fail
                onFailure: continue
              - name: settle
                type: reason
                resume: implement
                dependsOn: [catch-up]
                prompt: prompts/reconcile.md
                outputs: schemas/implement.schema.json
          - name: fold-checks
            dependsOn: [fold]
            when: "orient.anchors && (item-blocked.answer ?? 'continue') != 'skip'"
            gather: [findings]
            onFailure: pause
            steps:
              - name: balance
                type: anchor-balance
                base: '{orient.startCommit}'
                rows: 'fold.rows'
              - name: citations
                type: anchor-citations
                paths: 'fold.written'
          - name: cite
            type: reason
            resume: implement
            on:
              step: fold-checks
              outcome: failure
              codes: [1]
            then: item-blocked
            maxVisits: 2
            prompt: prompts/anchors.md
            outputs: schemas/implement.schema.json
          - name: checkpoint
            type: commit
            dependsOn: [fold-checks]
            message: |-
              {item.title}

              Committed when the item was folded, before its review and the round's gate.
              Checked:
              {carried.ran}
              Not checked:
              {carried.notRun}
              Known red:
              {carried.red}
          - name: checkpoint-push
            type: push
            checkpoint: true
            dependsOn: [checkpoint]
            when: 'orient.hasRemote'
          - name: fix
            dependsOn: [checkpoint-push]
            when: "(item-blocked.answer ?? 'continue') != 'skip'"
            repeat:
              until: 'empty(review.findings)'
              rounds: 3
              # Three passes at most; while a critical, high or medium finding stands the loop goes on -
              # only a low or a nit may outlive the count, and each that does is written to the backlog.
              blocking: "any(review.findings, it.severity != 'low' && it.severity != 'nit')"
              blockersLimitRounds: 3
              leftover: 'review.findings'
            answers:
              loopBound: accept
            steps:
              - name: review-scope
                type: reason
                agent: review-scope
                tier: fast
                effort: low
                prompt: prompts/review-scope.md
                outputs: schemas/review-scope.schema.json
              - name: review
                dependsOn: [review-scope]
                gather: [findings]
                steps:
                  - name: correctness
                    type: reason
                    agent: reviewer-correctness
                    tier: best
                    effort: max
                    independent: true
                    prompt: prompts/review.md
                    outputs: schemas/review.schema.json
                  - name: errors
                    type: reason
                    agent: reviewer-errors
                    tier: best
                    effort: max
                    independent: true
                    when: 'review-scope.errors'
                    prompt: prompts/review.md
                    outputs: schemas/review.schema.json
                  - name: tests
                    type: reason
                    agent: reviewer-tests
                    tier: best
                    effort: max
                    independent: true
                    when: 'review-scope.tests'
                    prompt: prompts/review.md
                    outputs: schemas/review.schema.json
                  - name: types
                    type: reason
                    agent: reviewer-types
                    tier: balanced
                    effort: high
                    independent: true
                    when: 'review-scope.types'
                    prompt: prompts/review.md
                    outputs: schemas/review.schema.json
                  - name: comments
                    type: reason
                    agent: reviewer-comments
                    tier: balanced
                    effort: high
                    independent: true
                    when: 'review-scope.comments'
                    prompt: prompts/review.md
                    outputs: schemas/review.schema.json
                  - name: simplicity
                    type: reason
                    agent: reviewer-simplicity
                    tier: balanced
                    effort: high
                    independent: true
                    when: 'review-scope.simplicity'
                    prompt: prompts/review.md
                    outputs: schemas/review.schema.json
              - name: revise
                dependsOn: [review]
                when: '!empty(review.findings)'
                steps:
                  - name: rework
                    type: reason
                    resume: implement
                    prompt: prompts/rework.md
                    outputs: schemas/implement.schema.json
                  - name: reverify
                    type: test
                    in: item-agent
                    filter: '{item.testFilter}'
                    dependsOn: [rework]
                    when: 'orient.hasLegs'
                    onFailure: pause
                  - name: remend
                    type: reason
                    resume: implement
                    on:
                      step: reverify
                      outcome: failure
                      codes: [20]
                    then: reverify
                    maxVisits: 3
                    prompt: prompts/mend.md
                    outputs: schemas/implement.schema.json
                  - name: refold
                    type: fold
                    of: item-agent
                    within: 'item.ownedPaths'
                    allow:
                      new: 'implement.latest.newRows'
                    answers:
                      foldNewRows: allow
                      foldTwoChanges: merge
                      foldConflicts: fail
                      foldOutside: fail
                    dependsOn: [reverify, remend]
                    onFailure: pause
                  - name: rereconcile
                    on:
                      step: refold
                      outcome: failure
                      codes: [13]
                    when: "refold.question == 'foldOutside' || refold.question == 'foldConflicts'"
                    then: reverify
                    maxVisits: 2
                    onFailure: pause
                    steps:
                      - name: recatch-up
                        type: refresh
                        of: item-agent
                        all: true
                        answers:
                          foldTwoChanges: merge
                          foldConflicts: fail
                        onFailure: continue
                      - name: resettle
                        type: reason
                        resume: implement
                        dependsOn: [recatch-up]
                        prompt: prompts/reconcile.md
                        outputs: schemas/implement.schema.json
                  - name: recheck
                    dependsOn: [refold]
                    when: 'orient.anchors'
                    gather: [findings]
                    onFailure: pause
                    steps:
                      - name: balance
                        type: anchor-balance
                        base: '{orient.startCommit}'
                        rows: 'refold.rows'
                      - name: citations
                        type: anchor-citations
                        paths: 'refold.written'
                  - name: recite
                    type: reason
                    resume: implement
                    on:
                      step: recheck
                      outcome: failure
                      codes: [1]
                    then: reverify
                    maxVisits: 2
                    prompt: prompts/anchors.md
                    outputs: schemas/implement.schema.json
                  - name: recheckpoint
                    type: commit
                    dependsOn: [recheck]
                    message: |-
                      {item.title}: review fixes

                      Committed when the fixes were folded, before the next review and the round's gate.
                      Checked:
                      {carried.ran}
                      Not checked:
                      {carried.notRun}
                      Known red:
                      {carried.red}
                  - name: repush
                    type: push
                    checkpoint: true
                    dependsOn: [recheckpoint]
                    when: 'orient.hasRemote'
          - name: release
            type: delete-agent
            of: item-agent
            within: 'item.ownedPaths'
            allow:
              new: 'implement.latest.newRows'
            answers:
              foldNewRows: allow
              foldTwoChanges: merge
            dependsOn: [fix]
            when: "(item-blocked.answer ?? 'continue') != 'skip'"
            onFailure: pause
          - name: drop
            type: delete-agent
            of: item-agent
            discardUncommitted: true
            dependsOn: [item-blocked]
            when: "(item-blocked.answer ?? 'continue') == 'skip'"
      - name: round-checks
        dependsOn: [items]
        when: 'orient.anchors'
        gather: [findings]
        onFailure: pause
        steps:
          - name: balance
            type: anchor-balance
            base: '{orient.startCommit}'
            failOn: never
          - name: citations
            type: anchor-citations
            failOn: never
      - name: gate
        type: test
        dependsOn: [items, round-checks]
        when: 'orient.hasLegs'
        alone: true
        failOn: never
        onFailure: pause
      - name: mutations
        type: check-mutations
        dependsOn: [gate]
        when: 'orient.hasLegs && orient.hasMutations && gate.passed'
        pending: true
        alone: true
        failOn: never
        onFailure: pause
      - name: self-audit
        type: reason
        agent: auditor
        tier: best
        effort: max
        independent: true
        dependsOn: [gate, mutations]
        prompt: prompts/self-audit.md
        outputs: schemas/self-audit.schema.json
  - name: notes
    type: create-agent
    agent: scribe
    dependsOn: [rounds]
  - name: deferrals
    type: reason
    agent: scribe
    tier: balanced
    effort: high
    access: write
    in: notes
    dependsOn: [notes]
    when: 'orient.anchors'
    prompt: prompts/deferrals.md
    outputs: schemas/summary.schema.json
  - name: handoff
    type: reason
    agent: scribe
    tier: balanced
    effort: high
    access: write
    in: notes
    dependsOn: [deferrals]
    prompt: prompts/handoff.md
    outputs: schemas/summary.schema.json
  - name: notes-fold
    type: fold
    of: notes
    allow:
      new: 'deferrals.latest.newRows'
    answers:
      foldNewRows: allow
    dependsOn: [handoff]
    onFailure: pause
  - name: notes-checks
    dependsOn: [notes-fold]
    when: 'orient.anchors'
    gather: [findings]
    onFailure: pause
    steps:
      - name: balance
        type: anchor-balance
        base: '{orient.startCommit}'
        rows: 'notes-fold.rows'
      - name: citations
        type: anchor-citations
        paths: 'notes-fold.written'
  - name: notes-cite
    type: reason
    resume: deferrals
    on:
      step: notes-checks
      outcome: failure
      codes: [1]
    then: notes-fold
    maxVisits: 2
    prompt: prompts/anchors.md
    outputs: schemas/summary.schema.json
  - name: notes-release
    type: delete-agent
    of: notes
    discardUncommitted: true
    dependsOn: [notes-checks]
  - name: final-commit
    type: commit
    dependsOn: [notes-release]
    message: |-
      {intake.triage.title}: handoff and deferrals

      Checked since the last commit:
      {carried.ran}
      Not checked:
      {carried.notRun}
      Known red:
      {carried.red}
  - name: final-push
    type: push
    dependsOn: [final-commit]
    when: 'orient.hasRemote'
  - name: pr
    type: pull-request
    dependsOn: [final-push]
    when: 'orient.hasRemote'
    title: '{intake.triage.title}'
    body: prompts/pr-body.md
  - name: checks
    type: ci-wait
    dependsOn: [pr]
    when: 'orient.hasRemote && orient.ciConfigured'
    waitMinutes: 60
    answers:
      checksPending:
        answer: more
        times: 2
    onFailure: pause
  - name: repair
    on:
      step: checks
      outcome: failure
      codes: [1]
    then: checks
    maxVisits: 3
    onFailure: pause
    steps:
      - name: repair-agent
        type: create-agent
        agent: fixer
      - name: repair-fix
        type: reason
        agent: fixer
        tier: balanced
        effort: max
        access: write
        in: repair-agent
        dependsOn: [repair-agent]
        prompt: prompts/fix-checks.md
        outputs: schemas/fix.schema.json
      - name: stuck
        type: pause
        dependsOn: [repair-fix]
        when: '!repair-fix.latest.changed || !empty(repair-fix.latest.blocked)'
        question: |-
          The checks of {pr.url} are red, and the repair cannot go on: its fixer changed nothing, or says it cannot do part of the repair. {repair-fix.latest.reason}
          What it cannot do: {repair-fix.latest.blocked}
          Answer retry once what stands in the way was dealt with, to read the checks again with nothing of this repair folded; or continue, with what the fixer is to do.
        options: [retry, continue]
        text: [continue]
      - name: repair-unblock
        type: reason
        resume: repair-fix
        on:
          step: stuck
          outcome: success
        when: "stuck.answer == 'continue'"
        then: stuck
        prompt: prompts/unblock.md
        outputs: schemas/fix.schema.json
      - name: repair-verify
        type: test
        in: repair-agent
        filter: '{repair-fix.latest.testFilter}'
        dependsOn: [stuck]
        when: "orient.hasLegs && repair-fix.latest.changed && (stuck.answer ?? 'continue') != 'retry'"
        onFailure: pause
      - name: repair-mend
        type: reason
        resume: repair-fix
        on:
          step: repair-verify
          outcome: failure
          codes: [20]
        then: repair-verify
        maxVisits: 3
        prompt: prompts/mend.md
        outputs: schemas/fix.schema.json
      - name: repair-fold
        type: fold
        of: repair-agent
        allow:
          new: 'repair-fix.latest.newRows'
        answers:
          foldNewRows: allow
        dependsOn: [repair-verify, repair-mend]
        when: "repair-fix.latest.changed && (stuck.answer ?? 'continue') != 'retry'"
        onFailure: pause
      - name: repair-checks
        dependsOn: [repair-fold]
        when: "orient.anchors && repair-fix.latest.changed && (stuck.answer ?? 'continue') != 'retry'"
        gather: [findings]
        onFailure: pause
        steps:
          - name: balance
            type: anchor-balance
            base: '{orient.startCommit}'
            rows: 'repair-fold.rows'
          - name: citations
            type: anchor-citations
            paths: 'repair-fold.written'
      - name: repair-cite
        type: reason
        resume: repair-fix
        on:
          step: repair-checks
          outcome: failure
          codes: [1]
        then: repair-verify
        maxVisits: 2
        prompt: prompts/anchors.md
        outputs: schemas/fix.schema.json
      - name: repair-commit
        type: commit
        dependsOn: [repair-checks]
        when: "repair-fix.latest.changed && (stuck.answer ?? 'continue') != 'retry'"
        message: |-
          {intake.triage.title}: repair of red checks

          {repair-fix.latest.summary}

          Checked:
          {carried.ran}
          Not checked:
          {carried.notRun}
          Known red:
          {carried.red}
      - name: repair-push
        type: push
        dependsOn: [repair-commit]
        when: "repair-fix.latest.changed && (stuck.answer ?? 'continue') != 'retry'"
      - name: repair-release
        type: delete-agent
        of: repair-agent
        discardUncommitted: true
        dependsOn: [repair-push]
